        @keyframes slideIn {

            to { transform: translateX(0); opacity: 1; }
        }

        @keyframes slideOut {
            from { transform: translateX(0); opacity: 1; }
            to { transform: translateX(100%); opacity: 0; }

// === LOAD STATS ===
async function loadStats() {
    try {
        // Load stats from database
        const { data: users, error: usersError } = await supabase
            .from('users')
            .select('count');
        
        const { data: profiles, error: profilesError } = await supabase
            .from('profiles')
            .select('stats_views');
        
        if (!usersError && users) {
            const userCount = Math.max(users[0]?.count || 0, 1254);
            animateCount('userCount', userCount);
        }
        
        if (!profilesError && profiles) {
            const profileCount = profiles.length || 892;
            const totalViews = profiles.reduce((sum, p) => sum + (p.stats_views || 0), 0);
            
            animateCount('profileCount', profileCount);
            animateCount('viewCount', Math.max(totalViews, 45678));
        }
        
        // Days active (since launch)
        const launchDate = new Date('2024-01-01');
        const daysActive = Math.floor((Date.now() - launchDate.getTime()) / (1000 * 60 * 60 * 24));
        animateCount('dayCount', daysActive);
        
    } catch (error) {
        console.error('Error loading stats:', error);
        // Fallback numbers
        animateCount('userCount', 1254);
        animateCount('profileCount', 892);
        animateCount('viewCount', 45678);
        animateCount('dayCount', 45);
    }
}

// === ANIMATE COUNT ===
function animateCount(elementId, target) {
    const element = document.getElementById(elementId);
    if (!element) return;
    
    let current = 0;
    const increment = target / 50;
    const timer = setInterval(() => {
        current += increment;
        if (current >= target) {
            current = target;
            clearInterval(timer);
        }
        element.textContent = Math.floor(current).toLocaleString();
    }, 30);
}

// === SHOW NOTIFICATION ===
function showNotification(message, type = 'success') {
    // Remove existing notifications
    document.querySelectorAll('.notification').forEach(n => n.remove());
    
    // Create notification element
    const notification = document.createElement('div');
    notification.className = `notification ${type === 'error' ? 'error' : ''}`;
    notification.textContent = message;
    document.body.appendChild(notification);
    
    // Auto remove
    setTimeout(() => {
        notification.style.animation = 'slideOut 0.3s ease';
        setTimeout(() => notification.remove(), 300);
    }, 3000);
}

// === LOGOUT ===

    showNotification('Logged out successfully');

// === SUPABASE CLIENT ===
const supabase = {
    from: (table) => {
        return {
            select: (columns = '*') => ({
                eq: (column, value) => ({
                    single: async () => {
                        try {
                            const response = await fetch(`${SUPABASE_URL}/rest/v1/${table}?${column}=eq.${value}&select=${columns}`, {
                                headers: {
                                    'apikey': SUPABASE_ANON_KEY,
                                    'Authorization': `Bearer ${SUPABASE_ANON_KEY}`,
                                    'Content-Type': 'application/json'
                                }
                            });
                            if (!response.ok) throw new Error('Network error');
                            const data = await response.json();
                            return { data: data[0], error: data.length === 0 ? { message: 'Not found' } : null };
                        } catch (error) {
                            return { data: null, error };
                        }
                    }
                }),
                or: (condition) => ({
                    single: async () => {
                        try {
                            const response = await fetch(`${SUPABASE_URL}/rest/v1/${table}?${condition}&select=${columns}`, {
                                headers: {
                                    'apikey': SUPABASE_ANON_KEY,
                                    'Authorization': `Bearer ${SUPABASE_ANON_KEY}`,
                                    'Content-Type': 'application/json'
                                }
                            });
                            if (!response.ok) throw new Error('Network error');
                            const data = await response.json();
                            return { data: data[0], error: data.length === 0 ? { message: 'Not found' } : null };
                        } catch (error) {
                            return { data: null, error };
                        }
                    }
                })
            })
        };
    }
};

// === PARTICLES SYSTEM ===
function initParticles() {
    const canvas = document.getElementById('particlesCanvas');
    if (!canvas) return;
    
    const ctx = canvas.getContext('2d');
    
    function resizeCanvas() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
    }
    
    resizeCanvas();
    window.addEventListener('resize', resizeCanvas);
    
    class Particle {
        constructor() {
            this.x = Math.random() * canvas.width;
            this.y = Math.random() * canvas.height;
            this.size = Math.random() * 1.8 + 0.4;
            this.vx = Math.random() * 0.4 - 0.2;
            this.vy = Math.random() * 0.4 - 0.2;
            this.o = Math.random() * 0.4 + 0.15;
            this.color = Math.random() > 0.8 ? 
                `rgba(180, 180, 255, ${this.o})` : 
                `rgba(255, 255, 255, ${this.o})`;
        }
        
        update() {
            this.x += this.vx;
            this.y += this.vy;
            
            if (this.x < 0 || this.x > canvas.width) this.vx *= -1;
            if (this.y < 0 || this.y > canvas.height) this.vy *= -1;
        }
        
        draw() {
            ctx.fillStyle = this.color;
            ctx.beginPath();
            ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
            ctx.fill();
        }
    }
    
    // Create particles
    for (let i = 0; i < 100; i++) {
        particles.push(new Particle());
    }
    
    function animate() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        
        particles.forEach(particle => {
            particle.update();
            particle.draw();
        });
        
        requestAnimationFrame(animate);
    }
    
    animate();
}

// === START APP ===
document.addEventListener('DOMContentLoaded', initApp);
