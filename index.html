<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>socialanxiety.lol</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: #000000;
            color: #ffffff;
            min-height: 100vh;
            overflow: hidden;
            position: relative;
        }

        /* Noise overlay */
        .noise {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 400 400' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)' opacity='0.15'/%3E%3C/svg%3E");
            pointer-events: none;
            z-index: 1;
            opacity: 0.3;
        }

        /* Main container */
        .main-container {
            position: relative;
            z-index: 2;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Animated background */
        .bg-lines {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: 
                linear-gradient(90deg, transparent 49%, rgba(255, 255, 255, 0.02) 50%, transparent 51%),
                linear-gradient(transparent 49%, rgba(255, 255, 255, 0.02) 50%, transparent 51%);
            background-size: 50px 50px;
            opacity: 0.2;
            z-index: 0;
            animation: gridMove 20s linear infinite;
        }

        @keyframes gridMove {
            0% { transform: translate(0, 0); }
            100% { transform: translate(50px, 50px); }
        }

        /* Center content */
        .center-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 2rem;
            position: relative;
        }

        /* Logo */
        .logo {
            font-size: 4.5rem;
            font-weight: 900;
            letter-spacing: -3px;
            margin-bottom: 3rem;
            position: relative;
            text-shadow: 
                0 0 20px rgba(255, 255, 255, 0.3),
                0 0 40px rgba(255, 255, 255, 0.1);
            animation: logoGlow 3s ease-in-out infinite alternate;
        }

        @keyframes logoGlow {
            0% {
                text-shadow: 
                    0 0 20px rgba(255, 255, 255, 0.2),
                    0 0 40px rgba(255, 255, 255, 0.1);
            }
            100% {
                text-shadow: 
                    0 0 30px rgba(255, 255, 255, 0.4),
                    0 0 60px rgba(255, 255, 255, 0.2),
                    0 0 90px rgba(255, 255, 255, 0.1);
            }
        }

        /* Button container */
        .buttons {
            display: flex;
            gap: 1.5rem;
            margin-top: 2rem;
        }

        /* Buttons */
        .btn {
            padding: 1rem 2.5rem;
            font-size: 0.9rem;
            font-weight: 600;
            letter-spacing: 2px;
            text-transform: uppercase;
            text-decoration: none;
            border-radius: 0;
            position: relative;
            overflow: hidden;
            transition: all 0.3s ease;
            border: 1px solid rgba(255, 255, 255, 0.3);
            background: transparent;
            color: #ffffff;
        }

        .btn:hover {
            border-color: #ffffff;
            background: rgba(255, 255, 255, 0.05);
            transform: translateY(-2px);
            box-shadow: 
                0 10px 20px rgba(255, 255, 255, 0.1),
                0 0 30px rgba(255, 255, 255, 0.05);
        }

        .btn-signup {
            background: #ffffff;
            color: #000000;
            border: 1px solid #ffffff;
        }

        .btn-signup:hover {
            background: rgba(255, 255, 255, 0.9);
            box-shadow: 
                0 10px 20px rgba(255, 255, 255, 0.2),
                0 0 40px rgba(255, 255, 255, 0.1);
        }

        /* Button lines */
        .btn::before,
        .btn::after {
            content: '';
            position: absolute;
            background: #ffffff;
            transition: all 0.3s ease;
        }

        .btn::before {
            top: 0;
            left: 0;
            width: 100%;
            height: 1px;
            transform: scaleX(0);
            transform-origin: left;
        }

        .btn::after {
            bottom: 0;
            right: 0;
            width: 100%;
            height: 1px;
            transform: scaleX(0);
            transform-origin: right;
        }

        .btn:hover::before,
        .btn:hover::after {
            transform: scaleX(1);
        }

        /* Floating elements */
        .floating-elements {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
        }

        .floating-element {
            position: absolute;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 50%;
            animation: floatElement 20s infinite linear;
        }

        @keyframes floatElement {
            0% {
                transform: translate(0, 0) rotate(0deg);
            }
            100% {
                transform: translate(100vw, 100vh) rotate(360deg);
            }
        }

        /* Scan line */
        .scan-line {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 2px;
            background: linear-gradient(90deg, 
                transparent, 
                rgba(255, 255, 255, 0.6), 
                transparent);
            animation: scan 4s linear infinite;
            z-index: 3;
            box-shadow: 0 0 20px rgba(255, 255, 255, 0.3);
        }

        @keyframes scan {
            0% {
                top: 0;
                opacity: 0;
            }
            10% {
                opacity: 1;
            }
            90% {
                opacity: 1;
            }
            100% {
                top: 100vh;
                opacity: 0;
            }
        }

        /* Responsive */
        @media (max-width: 768px) {
            .logo {
                font-size: 3rem;
                letter-spacing: -2px;
            }
            
            .buttons {
                flex-direction: column;
                gap: 1rem;
            }
            
            .btn {
                padding: 1rem 2rem;
                font-size: 0.8rem;
            }
        }
    </style>
</head>
<body>
    <div class="noise"></div>
    <div class="bg-lines"></div>
    <div class="scan-line"></div>
    
    <!-- Floating elements will be added by JS -->
    <div class="floating-elements" id="floatingElements"></div>

    <div class="main-container">
        <div class="center-content">
            <div class="logo">socialanxiety.lol</div>
            <div class="buttons">
                <a href="login.html" class="btn">LOGIN</a>
                <a href="signup.html" class="btn btn-signup">SIGN UP</a>
            </div>
        </div>
    </div>

    <script>
        // Create floating elements
        function createFloatingElements() {
            const container = document.getElementById('floatingElements');
            const count = 8;
            
            for (let i = 0; i < count; i++) {
                const element = document.createElement('div');
                const size = Math.random() * 200 + 50;
                const duration = Math.random() * 30 + 20;
                const delay = Math.random() * 5;
                
                element.className = 'floating-element';
                element.style.width = size + 'px';
                element.style.height = size + 'px';
                element.style.left = Math.random() * 100 + 'vw';
                element.style.top = Math.random() * 100 + 'vh';
                element.style.animationDuration = duration + 's';
                element.style.animationDelay = delay + 's';
                
                container.appendChild(element);
            }
        }

        // Create pulse effect
        function createPulse() {
            const pulse = document.createElement('div');
            pulse.style.position = 'fixed';
            pulse.style.top = '50%';
            pulse.style.left = '50%';
            pulse.style.transform = 'translate(-50%, -50%)';
            pulse.style.width = '1px';
            pulse.style.height = '1px';
            pulse.style.borderRadius = '50%';
            pulse.style.boxShadow = '0 0 200px 200px rgba(255, 255, 255, 0.03)';
            pulse.style.animation = 'pulseEffect 8s ease-in-out infinite';
            pulse.style.zIndex = '0';
            
            const style = document.createElement('style');
            style.textContent = `
                @keyframes pulseEffect {
                    0%, 100% { opacity: 0.1; transform: translate(-50%, -50%) scale(0.8); }
                    50% { opacity: 0.3; transform: translate(-50%, -50%) scale(1.2); }
                }
            `;
            document.head.appendChild(style);
            document.body.appendChild(pulse);
        }

        // Initialize on load
        document.addEventListener('DOMContentLoaded', () => {
            createFloatingElements();
            createPulse();
            
            // Add keyboard shortcut for login
            document.addEventListener('keydown', (e) => {
                if (e.key === 'Enter') {
                    window.location.href = 'signup.html';
                }
            });
        });
    </script>
</body>
</html>
