<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>socialanxiety.lol</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Courier New', monospace;
        }

        body {
            background-color: #000;
            color: #fff;
            overflow: hidden;
            min-height: 100vh;
        }

        /* Background */
        #background-gif {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: 1;
            pointer-events: none;
            filter: brightness(0.55);
            transition: filter 0.4s ease;
        }

        /* Main Content */
        .main-content {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: min(90%, 800px);
            z-index: 10;
            text-align: center;
        }

        #profile-block {
            background: rgba(0, 0, 0, 0.85);
            border: 1px solid rgba(255, 255, 255, 0.15);
            padding: 3.5rem 2.5rem;
            border-radius: 20px;
            backdrop-filter: blur(20px);
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
        }

        /* Typography */
        #main-title {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Courier New', monospace;
            font-size: 3.5rem;
            font-weight: 600;
            letter-spacing: 1px;
            color: #fff;
            margin-bottom: 2.5rem;
            line-height: 1.2;
        }

        .link-line {
            font-family: 'Courier New', monospace;
            font-size: 1.3rem;
            font-weight: 400;
            color: rgba(255, 255, 255, 0.9);
            margin: 1.2rem 0;
            letter-spacing: 1px;
            text-decoration: none;
            display: block;
            padding: 1.1rem 2rem;
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            transition: all 0.3s ease;
            width: 100%;
            max-width: 500px;
            margin-left: auto;
            margin-right: auto;
        }

        .link-line:hover {
            background: rgba(255, 255, 255, 0.1);
            border-color: rgba(255, 255, 255, 0.4);
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.3);
        }

        /* Start Screen */
        #start-screen {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100vh;
            background: rgba(0, 0, 0, 0.95);
            backdrop-filter: blur(10px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 100;
            cursor: pointer;
            opacity: 1;
            transition: opacity 0.8s ease;
        }

        #start-text {
            font-family: 'Courier New', monospace;
            font-size: 1.4rem;
            color: rgba(255, 255, 255, 0.9);
            padding: 2rem;
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            text-align: center;
            line-height: 1.6;
            max-width: 500px;
            animation: fadeInOut 2s ease-in-out infinite;
        }

        @keyframes fadeInOut {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.7; }
        }

        /* Controls Panel */
        .controls-panel {
            position: fixed;
            bottom: 2rem;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            align-items: center;
            gap: 1.5rem;
            z-index: 20;
            background: rgba(0, 0, 0, 0.8);
            padding: 0.9rem 1.8rem;
            border-radius: 30px;
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            min-width: 300px;
            justify-content: center;
        }

        .control-group {
            display: flex;
            align-items: center;
            gap: 0.8rem;
        }

        .slider-label {
            font-family: 'Courier New', monospace;
            font-size: 0.9rem;
            letter-spacing: 1px;
            opacity: 0.8;
            min-width: 70px;
        }

        .slider {
            width: 100px;
            height: 4px;
            -webkit-appearance: none;
            appearance: none;
            background: rgba(255, 255, 255, 0.15);
            border-radius: 2px;
            outline: none;
            transition: all 0.3s ease;
        }

        .slider:hover {
            background: rgba(255, 255, 255, 0.25);
        }

        .slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background: white;
            cursor: pointer;
            border: 2px solid rgba(0, 0, 0, 0.5);
            transition: all 0.3s ease;
        }

        .slider::-webkit-slider-thumb:hover {
            transform: scale(1.1);
        }

        /* Responsive */
        @media (max-width: 768px) {
            #main-title { 
                font-size: 2.8rem; 
                margin-bottom: 2rem;
            }
            
            .link-line { 
                font-size: 1.1rem; 
                padding: 1rem 1.5rem;
                max-width: 90%;
            }
            
            #profile-block { 
                padding: 2.5rem 1.5rem; 
                width: 95%;
            }
            
            #start-text { 
                font-size: 1.2rem; 
                padding: 1.5rem;
                margin: 0 1rem;
            }
            
            .controls-panel { 
                flex-direction: column; 
                gap: 1rem; 
                padding: 1rem;
                width: 90%;
                min-width: auto;
            }
            
            .slider {
                width: 120px;
            }
        }

        @media (max-width: 480px) {
            #main-title { 
                font-size: 2.2rem; 
            }
            
            .link-line { 
                font-size: 1rem; 
                padding: 0.9rem 1.2rem;
            }
            
            .controls-panel { 
                padding: 0.8rem; 
            }
            
            .slider-label {
                font-size: 0.85rem;
                min-width: 65px;
            }
        }
    </style>
</head>
<body>
    <!-- Start Screen -->
    <div id="start-screen" onclick="startExperience()">
        <div id="start-text">Click anywhere to enter</div>
    </div>

    <!-- Background GIF -->
    <img id="background-gif" src="https://i.pinimg.com/originals/bc/e3/c1/bce3c11d524a3e8c2e2efed0a8db210a.gif" alt="Background">

    <!-- Hidden YouTube Audio -->
    <iframe id="bg-audio" width="0" height="0" src="https://www.youtube-nocookie.com/embed/Me-HQ_vS1Ac?autoplay=0&loop=1&playlist=Me-HQ_vS1Ac&controls=0&mute=0&enablejsapi=1" frameborder="0" allow="autoplay" style="position:absolute; opacity:0;"></iframe>

    <!-- Main Content -->
    <div class="main-content">
        <div id="profile-block">
            <h1 id="main-title">socialanxiety.lol</h1>
            <a href="https://socialanxiety.lol/opsec" target="_blank" class="link-line">socialanxiety.lol/opsec</a>
            <a href="https://socialanxiety.lol/board" target="_blank" class="link-line">socialanxiety.lol/board</a>
        </div>
    </div>

    <!-- Controls Panel -->
    <div class="controls-panel">
        <div class="control-group">
            <span class="slider-label">Volume</span>
            <input id="volume-slider" class="slider" type="range" min="0" max="1" step="0.01" value="0.4">
        </div>
        
        <div class="control-group">
            <span class="slider-label">Brightness</span>
            <input id="transparency-slider" class="slider" type="range" min="0.3" max="1" step="0.05" value="0.55">
        </div>
    </div>

    <script>
        let player;
        function onYouTubeIframeAPIReady() {
            player = new YT.Player('bg-audio', {
                events: {
                    'onReady': function(e) {
                        e.target.setVolume(40);
                    }
                }
            });
        }

        function startExperience() {
            const startScreen = document.getElementById('start-screen');
            startScreen.style.opacity = '0';
            setTimeout(() => { startScreen.style.display = 'none'; }, 800);

            // Start audio
            const iframe = document.getElementById('bg-audio');
            iframe.src = iframe.src.replace('autoplay=0', 'autoplay=1');
        }

        document.getElementById('volume-slider').oninput = function() {
            if (player && player.setVolume) {
                player.setVolume(this.value * 100);
            }
        };

        document.getElementById('transparency-slider').oninput = function() {
            document.getElementById('background-gif').style.filter = 'brightness(' + this.value + ')';
        };

        // Touch device detection
        if ('ontouchstart' in window || navigator.maxTouchPoints) {
            document.body.classList.add('touch-device');
        }
    </script>
    <script src="https://www.youtube.com/iframe_api"></script>
</body>
</html>
