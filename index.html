<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>socialanxiety.lol</title>
    <link rel="stylesheet" href="style.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: #000000;
            color: #ffffff;
            min-height: 100vh;
            overflow: hidden;
        }

        .star-background {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            pointer-events: none;
        }

        .landing-container {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 2rem;
            position: relative;
        }

        .logo {
            font-size: 5rem;
            font-weight: 900;
            letter-spacing: -3px;
            margin-bottom: 3rem;
            text-align: center;
            position: relative;
        }

        .logo-text {
            background: linear-gradient(135deg, #ffffff 0%, #cccccc 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .logo::after {
            content: '';
            position: absolute;
            bottom: -10px;
            left: 50%;
            transform: translateX(-50%);
            width: 100px;
            height: 2px;
            background: #ffffff;
            animation: linePulse 2s ease-in-out infinite;
        }

        @keyframes linePulse {
            0%, 100% { width: 100px; opacity: 1; }
            50% { width: 150px; opacity: 0.5; }
        }

        .buttons {
            display: flex;
            gap: 1.5rem;
            margin-top: 2rem;
        }

        .btn {
            padding: 1rem 3rem;
            font-size: 0.9rem;
            font-weight: 600;
            letter-spacing: 2px;
            text-transform: uppercase;
            text-decoration: none;
            border: 2px solid #ffffff;
            background: transparent;
            color: #ffffff;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .btn:hover {
            background: #ffffff;
            color: #000000;
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(255, 255, 255, 0.1);
        }

        .btn-login {
            border: 2px solid #ffffff;
        }

        .btn-signup {
            background: #ffffff;
            color: #000000;
            border: 2px solid #ffffff;
        }

        .btn-signup:hover {
            background: rgba(255, 255, 255, 0.9);
        }

        .scan-line {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 2px;
            background: linear-gradient(90deg, 
                transparent, 
                rgba(255, 255, 255, 0.6), 
                transparent);
            animation: scan 4s linear infinite;
            z-index: 100;
            box-shadow: 0 0 20px rgba(255, 255, 255, 0.3);
        }

        @keyframes scan {
            0% {
                top: 0;
                opacity: 0;
            }
            10% {
                opacity: 1;
            }
            90% {
                opacity: 1;
            }
            100% {
                top: 100vh;
                opacity: 0;
            }
        }

        @media (max-width: 768px) {
            .logo {
                font-size: 3rem;
                letter-spacing: -2px;
            }
            
            .buttons {
                flex-direction: column;
                gap: 1rem;
            }
            
            .btn {
                width: 100%;
                text-align: center;
            }
        }
    </style>
</head>
<body>
    <div class="scan-line"></div>
    
    <div class="landing-container">
        <div class="logo">
            <div class="logo-text">socialanxiety.lol</div>
        </div>
        <div class="buttons">
            <a href="login.html" class="btn btn-login">LOGIN</a>
            <a href="signup.html" class="btn btn-signup">SIGN UP</a>
        </div>
    </div>

    <canvas class="star-background" id="starCanvas"></canvas>

    <script>
        // Star background animation
        function initStars() {
            const canvas = document.getElementById('starCanvas');
            const ctx = canvas.getContext('2d');
            
            function resizeCanvas() {
                canvas.width = window.innerWidth;
                canvas.height = window.innerHeight;
            }
            
            window.addEventListener('resize', resizeCanvas);
            resizeCanvas();
            
            class Star {
                constructor() {
                    this.reset();
                }
                
                reset() {
                    this.x = Math.random() * canvas.width;
                    this.y = Math.random() * -100;
                    this.size = Math.random() * 2 + 1;
                    this.speed = Math.random() * 2 + 1;
                    this.opacity = Math.random() * 0.5 + 0.3;
                }
                
                update() {
                    this.y += this.speed;
                    this.x += Math.sin(this.y * 0.01) * 0.5;
                    
                    if (this.y > canvas.height) {
                        this.reset();
                        this.y = -10;
                    }
                }
                
                draw() {
                    ctx.beginPath();
                    ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                    ctx.fillStyle = `rgba(255, 255, 255, ${this.opacity})`;
                    ctx.fill();
                }
            }
            
            const stars = [];
            const starCount = Math.min(100, Math.floor(window.innerWidth / 20));
            
            for (let i = 0; i < starCount; i++) {
                stars.push(new Star());
            }
            
            function animate() {
                ctx.fillStyle = 'rgba(0, 0, 0, 0.1)';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                
                stars.forEach(star => {
                    star.update();
                    star.draw();
                });
                
                requestAnimationFrame(animate);
            }
            
            animate();
        }
        
        // Initialize stars on load
        document.addEventListener('DOMContentLoaded', initStars);
    </script>
</body>
</html>
