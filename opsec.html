<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>@opsec</title>
    
    <!-- Open Graph Meta Tags for Discord Embeds -->
    <meta property="og:title" content="@opsec">
    <meta property="og:description" content="untested opsec">
    <meta property="og:image" content="https://i.pinimg.com/736x/2f/da/ef/2fdaef26eb8fdbf0d0dee3003a354fc0.jpg">
    <meta property="og:url" content="https://yourdomain.com">
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="@opsec">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="@opsec">
    <meta name="twitter:description" content="untested opsec">
    <meta name="twitter:image" content="https://i.pinimg.com/736x/2f/da/ef/2fdaef26eb8fdbf0d0dee3003a354fc0.jpg">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Courier New', monospace;
        }

        body {
            background-color: #000;
            color: #fff;
            overflow: hidden;
            min-height: 100vh;
        }

        /* Custom Cursor */
        .custom-cursor {
            position: fixed;
            width: 32px;
            height: 32px;
            background: url('assets/custom_cursor.png') no-repeat center center;
            background-size: contain;
            pointer-events: none;
            z-index: 9999;
            transform: translate(-50%, -50%);
        }

        body:not(.touch-device) {
            cursor: none;
        }

        /* Container & Background */
        .container {
            width: 100%;
            height: 100vh;
            position: relative;
        }

        #background {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: 1;
            pointer-events: none;
            filter: brightness(0.7);
        }

        /* Overlays */
        .glitch-overlay,
        #hacker-overlay,
        #snow-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 2;
        }

        #hacker-overlay,
        #snow-overlay {
            z-index: 3;
        }

        .hidden {
            display: none !important;
        }

        /* Main Content Container */
        .main-content {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: min(90%, 700px);
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2rem;
        }

        /* Profile Card */
        #profile-block {
            background: rgba(0, 0, 0, 0.85);
            border: 1px solid rgba(255, 255, 255, 0.15);
            padding: 2.5rem;
            border-radius: 20px;
            width: 100%;
            backdrop-filter: blur(20px);
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
            transform-style: preserve-3d;
            transition: transform 0.5s ease-out, opacity 0.5s ease;
            opacity: 0;
        }

        .profile-header {
            display: flex;
            align-items: center;
            gap: 2rem;
            margin-bottom: 1.5rem;
        }

        .profile-container {
            position: relative;
            width: 140px;
            height: 140px;
            flex-shrink: 0;
        }

        .profile-container::after {
            content: '';
            position: absolute;
            top: -4px;
            left: -4px;
            right: -4px;
            bottom: -4px;
            border-radius: 50%;
            background: radial-gradient(circle at 30% 30%, var(--primary-color, #00CED1) 0%, transparent 70%);
            animation: orbit 8s linear infinite;
            z-index: -1;
            opacity: 0.4;
        }

        .profile-picture {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid rgba(255, 255, 255, 0.2);
            transition: transform 0.3s ease;
        }

        .profile-picture:hover {
            transform: scale(1.05);
        }

        /* Typography */
        @font-face {
            font-family: 'Angel Wish';
            src: url('assets/Angel_wish.ttf') format('truetype');
        }

        #profile-name {
            font-family: 'Angel Wish', 'Courier New', monospace;
            font-size: 2.8rem;
            font-weight: 600;
            letter-spacing: 2px;
            color: #fff;
            text-shadow: 0 0 20px rgba(255, 255, 255, 0.5);
            margin-bottom: 0.5rem;
            line-height: 1.2;
        }

        .opsec-tag {
            display: inline-block;
            background: linear-gradient(135deg, rgba(0, 195, 255, 0.2), rgba(255, 0, 255, 0.2));
            color: #fff;
            padding: 0.5rem 1.5rem;
            border-radius: 30px;
            font-size: 0.9rem;
            letter-spacing: 1px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(10px);
            margin-top: 0.5rem;
            transition: all 0.3s ease;
        }

        .opsec-tag:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0, 195, 255, 0.3);
        }

        #profile-bio {
            color: rgba(255, 255, 255, 0.9);
            font-size: 1.1rem;
            line-height: 1.6;
            margin: 1rem 0;
            font-weight: 300;
        }

        /* Separator */
        .bio-separator {
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
            margin: 2rem 0;
        }

        /* Social Links - Glowing Icons */
        .social-links {
            display: flex;
            justify-content: center;
            gap: 2rem;
            margin: 2rem 0;
        }

        .social-link {
            position: relative;
            width: 44px;
            height: 44px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .social-icon {
            width: 32px;
            height: 32px;
            transition: all 0.3s ease;
            filter: drop-shadow(0 0 8px currentColor);
            position: relative;
            z-index: 2;
        }

        /* Discord Icon Color */
        .social-link.discord .social-icon {
            color: #5865F2;
        }

        /* TikTok Icon Color */
        .social-link.tiktok .social-icon {
            color: #000000;
            filter: drop-shadow(0 0 8px #ff0050);
        }

        /* Glow Effect */
        .social-link::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 48px;
            height: 48px;
            border-radius: 50%;
            background: currentColor;
            opacity: 0;
            filter: blur(12px);
            transition: all 0.4s ease;
            z-index: 1;
        }

        .social-link.discord::before {
            background: #5865F2;
        }

        .social-link.tiktok::before {
            background: #ff0050;
        }

        .social-link:hover {
            transform: translateY(-4px) scale(1.1);
        }

        .social-link:hover::before {
            opacity: 0.4;
            width: 56px;
            height: 56px;
        }

        .social-link:hover .social-icon {
            transform: scale(1.2);
            filter: drop-shadow(0 0 16px currentColor);
        }

        /* Footer */
        .profile-footer {
            display: flex;
            justify-content: center;
            align-items: center;
            margin-top: 1.5rem;
            padding-top: 1.5rem;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
        }

        .visitor-counter {
            display: flex;
            align-items: center;
            gap: 0.8rem;
            background: rgba(255, 255, 255, 0.1);
            padding: 0.6rem 1.2rem;
            border-radius: 20px;
            font-size: 0.9rem;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .visitor-counter::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.1), transparent);
            transition: left 0.6s ease;
        }

        .visitor-counter:hover::before {
            left: 100%;
        }

        .visitor-counter:hover {
            background: rgba(255, 255, 255, 0.15);
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
        }

        .visitor-icon {
            width: 18px;
            height: 18px;
            opacity: 0.9;
        }

        /* Controls Panel - Simplified */
        .controls-panel {
            position: fixed;
            bottom: 2rem;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            align-items: center;
            gap: 1rem;
            z-index: 20;
            background: rgba(0, 0, 0, 0.8);
            padding: 0.8rem 1.5rem;
            border-radius: 30px;
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            min-width: 300px;
            justify-content: center;
        }

        .theme-selector {
            display: flex;
            gap: 0.5rem;
        }

        .theme-button {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            border: 2px solid rgba(255, 255, 255, 0.15);
            background: rgba(255, 255, 255, 0.05);
            color: white;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.8rem;
            font-weight: bold;
            transition: all 0.3s ease;
        }

        .theme-button:hover,
        .theme-button.active {
            transform: scale(1.15);
            border-color: rgba(255, 255, 255, 0.8);
            background: rgba(255, 255, 255, 0.15);
            box-shadow: 0 0 15px rgba(255, 255, 255, 0.3);
        }

        .control-group {
            display: flex;
            align-items: center;
            gap: 0.8rem;
        }

        .control-icon {
            width: 20px;
            height: 20px;
            color: white;
            opacity: 0.8;
            transition: opacity 0.3s ease;
        }

        .control-group:hover .control-icon {
            opacity: 1;
        }

        .slider {
            width: 80px;
            height: 4px;
            -webkit-appearance: none;
            appearance: none;
            background: rgba(255, 255, 255, 0.15);
            border-radius: 2px;
            outline: none;
            transition: all 0.3s ease;
        }

        .slider:hover {
            background: rgba(255, 255, 255, 0.25);
        }

        .slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background: white;
            cursor: pointer;
            box-shadow: 0 0 10px rgba(255, 255, 255, 0.5);
            border: 2px solid rgba(0, 0, 0, 0.5);
            transition: all 0.3s ease;
        }

        .slider::-webkit-slider-thumb:hover {
            transform: scale(1.2);
            box-shadow: 0 0 15px rgba(255, 255, 255, 0.8);
        }

        /* Results Button */
        #results-button-container {
            position: fixed;
            top: 2rem;
            left: 50%;
            transform: translateX(-50%);
            z-index: 20;
        }

        #results-theme {
            background: rgba(0, 0, 0, 0.8);
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 0.8rem 1.8rem;
            border-radius: 30px;
            cursor: pointer;
            font-family: 'Courier New', monospace;
            font-size: 0.9rem;
            letter-spacing: 1.5px;
            backdrop-filter: blur(10px);
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        #results-theme::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.1), transparent);
            transition: left 0.6s ease;
        }

        #results-theme:hover::before {
            left: 100%;
        }

        #results-theme:hover {
            background: rgba(0, 0, 0, 0.9);
            border-color: rgba(255, 255, 255, 0.4);
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.4);
        }

        /* Skills Block */
        #skills-block {
            background: rgba(0, 0, 0, 0.85);
            border: 1px solid rgba(255, 255, 255, 0.15);
            padding: 2.5rem;
            border-radius: 20px;
            width: 100%;
            backdrop-filter: blur(20px);
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
            transform-style: preserve-3d;
            transition: transform 0.5s ease-out;
        }

        .skills-title {
            font-size: 1.8rem;
            text-align: center;
            margin-bottom: 2rem;
            color: rgba(255, 255, 255, 0.9);
            font-weight: 300;
            letter-spacing: 2px;
        }

        .skill {
            margin: 1.5rem 0;
        }

        .skill-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 0.5rem;
        }

        .skill-name {
            display: flex;
            align-items: center;
            gap: 0.8rem;
            font-size: 1.1rem;
        }

        .skill-icon {
            width: 24px;
            height: 24px;
        }

        .skill-bar {
            height: 8px;
            background: rgba(255, 255, 255, 0.08);
            border-radius: 4px;
            overflow: hidden;
            position: relative;
        }

        .skill-progress {
            height: 100%;
            border-radius: 4px;
            width: 0%;
            transition: width 1.5s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            overflow: hidden;
        }

        .skill-progress::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(90deg, 
                transparent 0%, 
                rgba(255, 255, 255, 0.3) 50%, 
                transparent 100%);
            animation: shimmer 2s infinite;
        }

        /* Start Screen */
        #start-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100vh;
            background: rgba(0, 0, 0, 0.95);
            backdrop-filter: blur(10px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 100;
            cursor: pointer;
            opacity: 1;
            transition: opacity 0.8s ease;
        }

        #start-text {
            font-family: 'Courier New', monospace;
            font-size: 1.5rem;
            color: rgba(255, 255, 255, 0.9);
            text-align: center;
            line-height: 1.6;
            max-width: 600px;
            padding: 2rem;
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            animation: pulse 2s ease-in-out infinite;
        }

        /* Animations */
        @keyframes orbit {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        @keyframes shimmer {
            0% { transform: translateX(-100%); }
            100% { transform: translateX(100%); }
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.7; }
        }

        @keyframes glow {
            0%, 100% { filter: drop-shadow(0 0 8px currentColor); }
            50% { filter: drop-shadow(0 0 16px currentColor); }
        }

        /* Theme Borders */
        .home-theme #profile-block,
        .home-theme #skills-block {
            border-color: rgba(0, 195, 255, 0.3);
        }

        .hacker-theme #profile-block,
        .hacker-theme #skills-block {
            border-color: rgba(0, 255, 0, 0.3);
        }

        .rain-theme #profile-block,
        .rain-theme #skills-block {
            border-color: rgba(100, 149, 237, 0.3);
        }

        .anime-theme #profile-block,
        .anime-theme #skills-block {
            border-color: rgba(255, 0, 255, 0.3);
        }

        .car-theme #profile-block,
        .car-theme #skills-block {
            border-color: rgba(255, 165, 0, 0.3);
        }

        /* Responsive Design */
        @media (max-width: 768px) {
            .main-content {
                width: 95%;
            }

            #profile-block,
            #skills-block {
                padding: 1.5rem;
                border-radius: 16px;
            }

            .profile-header {
                flex-direction: column;
                text-align: center;
                gap: 1.5rem;
            }

            .profile-container {
                width: 120px;
                height: 120px;
            }

            #profile-name {
                font-size: 2rem;
            }

            .controls-panel {
                flex-direction: column;
                gap: 1rem;
                padding: 1rem;
                min-width: 250px;
            }

            .theme-selector {
                order: 3;
                margin-top: 0.5rem;
            }

            .social-links {
                gap: 1.5rem;
            }

            .social-link {
                width: 40px;
                height: 40px;
            }
        }

        @media (max-width: 480px) {
            #profile-name {
                font-size: 1.6rem;
            }

            #profile-bio {
                font-size: 1rem;
            }

            .skills-title {
                font-size: 1.4rem;
            }

            .theme-button {
                width: 32px;
                height: 32px;
                font-size: 0.7rem;
            }

            .slider {
                width: 70px;
            }

            .controls-panel {
                width: 90%;
                padding: 0.8rem;
            }
        }
    </style>
</head>
