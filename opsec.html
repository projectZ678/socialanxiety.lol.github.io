<head>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
        }

        body {
            background: #000;
            color: #fff;
            min-height: 100vh;
            overflow-x: hidden;
            font-family: 'Inter', 'Segoe UI', 'Courier New', monospace;
            transition: background 0.4s ease;
        }

        /* custom cursor */
        .custom-cursor {
            position: fixed;
            width: 28px;
            height: 28px;
            background: radial-gradient(circle, rgba(255,255,255,0.9), rgba(0,255,255,0.4));
            border-radius: 50%;
            pointer-events: none;
            z-index: 9999;
            transform: translate(-50%, -50%);
            mix-blend-mode: difference;
            transition: transform 0.1s ease;
            box-shadow: 0 0 12px cyan;
            backdrop-filter: blur(2px);
        }

        body:not(.touch-device) {
            cursor: none;
        }

        /* background video layer */
        #bg-video {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: 0;
            filter: brightness(0.55) saturate(1.2);
            transition: filter 0.5s ease;
        }

        /* dynamic overlays */
        .fx-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
        }

        #glitchCanvas, #particleCanvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
        }

        /* main glass panel */
        .glass-panel {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: min(92%, 760px);
            z-index: 15;
            background: rgba(8, 8, 12, 0.75);
            backdrop-filter: blur(18px);
            border-radius: 2rem;
            border: 1px solid rgba(0, 255, 255, 0.25);
            box-shadow: 0 25px 45px rgba(0,0,0,0.5), 0 0 0 1px rgba(0,255,255,0.1) inset;
            transition: all 0.35s cubic-bezier(0.2, 0.9, 0.4, 1.1);
            opacity: 0;
            transform: translate(-50%, -45%);
        }

        .glass-panel.visible {
            opacity: 1;
            transform: translate(-50%, -50%);
        }

        .profile-inner {
            padding: 2rem 2rem 1.8rem;
        }

        .profile-flex {
            display: flex;
            align-items: center;
            gap: 2rem;
            flex-wrap: wrap;
            justify-content: center;
        }

        .avatar-wrapper {
            position: relative;
            width: 130px;
            height: 130px;
            flex-shrink: 0;
        }

        .avatar-wrapper img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 50%;
            border: 2px solid rgba(0,255,255,0.7);
            box-shadow: 0 0 28px rgba(0,255,255,0.3);
            transition: 0.3s;
        }

        .avatar-wrapper::after {
            content: '';
            position: absolute;
            inset: -6px;
            border-radius: 50%;
            background: conic-gradient(from 0deg, cyan, magenta, cyan);
            opacity: 0.5;
            z-index: -1;
            animation: spinGlow 6s linear infinite;
        }

        @keyframes spinGlow {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .info h1 {
            font-size: 2.6rem;
            font-weight: 700;
            background: linear-gradient(135deg, #fff, #0ff);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            letter-spacing: -0.5px;
        }

        .badge {
            display: inline-block;
            background: rgba(0,255,255,0.15);
            backdrop-filter: blur(8px);
            padding: 0.3rem 1.2rem;
            border-radius: 40px;
            font-size: 0.75rem;
            font-weight: 500;
            border: 1px solid rgba(0,255,255,0.4);
            margin: 0.8rem 0 0.6rem;
        }

        .bio-text {
            color: #ddd;
            font-size: 0.95rem;
            line-height: 1.5;
            max-width: 380px;
        }

        .divider {
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(0,255,255,0.4), transparent);
            margin: 1.6rem 0;
        }

        .social-row {
            display: flex;
            justify-content: center;
            gap: 2.2rem;
            margin: 1.2rem 0;
        }

        .social-icon-link {
            transition: all 0.25s;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .social-svg {
            width: 36px;
            height: 36px;
            filter: drop-shadow(0 0 4px currentColor);
            transition: transform 0.2s, filter 0.2s;
        }

        .social-icon-link:hover .social-svg {
            transform: scale(1.2);
            filter: drop-shadow(0 0 12px currentColor);
        }

        .visitor-card {
            display: flex;
            justify-content: center;
            margin-top: 1rem;
        }

        .counter {
            background: rgba(0,0,0,0.5);
            padding: 0.45rem 1.2rem;
            border-radius: 60px;
            font-size: 0.85rem;
            display: flex;
            gap: 0.5rem;
            align-items: center;
            border: 0.5px solid rgba(255,255,255,0.2);
        }

        /* skills section */
        .skills-panel {
            margin-top: 1.4rem;
            background: rgba(0,0,0,0.4);
            border-radius: 1.5rem;
            padding: 1.2rem 1.5rem;
            transition: all 0.4s;
        }

        .skills-title {
            font-size: 1.3rem;
            font-weight: 500;
            letter-spacing: 1px;
            margin-bottom: 1rem;
            display: flex;
            gap: 0.6rem;
            align-items: center;
        }

        .skill-item {
            margin-bottom: 1.2rem;
        }

        .skill-header {
            display: flex;
            justify-content: space-between;
            font-size: 0.85rem;
            margin-bottom: 6px;
        }

        .progress-bg {
            height: 8px;
            background: rgba(255,255,255,0.1);
            border-radius: 8px;
            overflow: hidden;
        }

        .progress-fill {
            width: 0%;
            height: 100%;
            border-radius: 8px;
            transition: width 1s cubic-bezier(0.22, 0.97, 0.36, 1);
        }

        /* controls bar */
        .control-dock {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 30;
            background: rgba(0,0,0,0.7);
            backdrop-filter: blur(20px);
            padding: 0.6rem 1.5rem;
            border-radius: 50px;
            display: flex;
            gap: 1.6rem;
            border: 0.5px solid rgba(255,255,255,0.15);
            font-size: 0.8rem;
        }

        .ctrl-group {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .theme-buttons {
            display: flex;
            gap: 8px;
        }

        .theme-dot {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: rgba(255,255,255,0.1);
            border: 1px solid rgba(255,255,255,0.3);
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.7rem;
        }

        .theme-dot.active, .theme-dot:hover {
            transform: scale(1.15);
            background: rgba(0,255,255,0.3);
            border-color: cyan;
            box-shadow: 0 0 8px cyan;
        }

        input[type="range"] {
            width: 90px;
            height: 3px;
            -webkit-appearance: none;
            background: rgba(255,255,255,0.3);
            border-radius: 3px;
        }

        input[type="range"]:focus {
            outline: none;
        }

        input[type="range"]::-webkit-slider-thumb {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: cyan;
            cursor: pointer;
            box-shadow: 0 0 6px cyan;
        }

        #skillsToggle {
            background: rgba(0,0,0,0.7);
            border: 1px solid cyan;
            color: cyan;
            padding: 0.4rem 1rem;
            border-radius: 40px;
            font-size: 0.75rem;
            cursor: pointer;
            backdrop-filter: blur(4px);
            transition: 0.2s;
        }

        #skillsToggle:hover {
            background: cyan;
            color: black;
            box-shadow: 0 0 12px cyan;
        }

        /* start overlay */
        #entry-screen {
            position: fixed;
            inset: 0;
            background: #000;
            z-index: 200;
            display: flex;
            align-items: center;
            justify-content: center;
            backdrop-filter: blur(2px);
            transition: opacity 0.8s ease;
            cursor: pointer;
        }

        .entry-card {
            text-align: center;
            border: 1px solid rgba(0,255,255,0.4);
            padding: 2rem 3rem;
            border-radius: 2rem;
            background: rgba(0,0,0,0.7);
            backdrop-filter: blur(12px);
            animation: pulseGlow 1.8s infinite;
        }

        @keyframes pulseGlow {
            0% { box-shadow: 0 0 0 0 rgba(0,255,255,0.3);}
            100% { box-shadow: 0 0 0 18px rgba(0,255,255,0);}
        }

        .hidden {
            display: none !important;
        }

        button {
            background: none;
            border: none;
            color: inherit;
        }

        @media (max-width: 650px) {
            .profile-flex { flex-direction: column; text-align: center; gap: 1rem; }
            .info h1 { font-size: 2rem; }
            .control-dock { gap: 0.8rem; padding: 0.5rem 1rem; flex-wrap: wrap; width: 95%; justify-content: center; }
            .glass-panel { width: 94%; }
        }
    </style>
</head>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script>
        // DOM elements
        const entryScreen = document.getElementById('entry-screen');
        const mainPanel = document.getElementById('mainPanel');
        const skillsWrapper = document.getElementById('skillsWrapper');
        const skillsToggle = document.getElementById('skillsToggle');
        const bgVideo = document.getElementById('bg-video');
        const bgAudio = document.getElementById('bgAudio');
        const volumeSlider = document.getElementById('volumeSlider');
        const glitchSlider = document.getElementById('glitchSlider');
        const themeBtns = document.querySelectorAll('.theme-dot');
        const visitorSpan = document.getElementById('visitorCount');
        
        let glitchIntensity = 0.3;
        let particleCtx, glitchCtx, particleCanvas, glitchCanvas;
        let animationFrame;
        let particles = [];
        
        // init visitor count fake dynamic
        let baseViews = 9842;
        setInterval(() => {
            baseViews += Math.floor(Math.random() * 3);
            visitorSpan.innerText = baseViews.toLocaleString();
        }, 8000);
        
        // ---------- canvas effects ----------
        function initCanvas() {
            particleCanvas = document.getElementById('particleCanvas');
            glitchCanvas = document.getElementById('glitchCanvas');
            particleCtx = particleCanvas.getContext('2d');
            glitchCtx = glitchCanvas.getContext('2d');
            
            function resize() {
                particleCanvas.width = window.innerWidth;
                particleCanvas.height = window.innerHeight;
                glitchCanvas.width = window.innerWidth;
                glitchCanvas.height = window.innerHeight;
                initParticles();
            }
            function initParticles() {
                particles = [];
                const count = Math.min(120, Math.floor(window.innerWidth / 12));
                for(let i=0;i<count;i++) {
                    particles.push({
                        x: Math.random() * particleCanvas.width,
                        y: Math.random() * particleCanvas.height,
                        radius: Math.random() * 1.5 + 0.8,
                        alpha: Math.random() * 0.5 + 0.2,
                        vx: (Math.random() - 0.5) * 0.3,
                        vy: (Math.random() - 0.5) * 0.2
                    });
                }
            }
            window.addEventListener('resize', resize);
            resize();
            
            function drawParticles() {
                if(!particleCtx) return;
                particleCtx.clearRect(0,0, particleCanvas.width, particleCanvas.height);
                particleCtx.fillStyle = '#0ff';
                for(let p of particles) {
                    particleCtx.globalAlpha = p.alpha * 0.6;
                    particleCtx.beginPath();
                    particleCtx.arc(p.x, p.y, p.radius, 0, Math.PI*2);
                    particleCtx.fill();
                    p.x += p.vx;
                    p.y += p.vy;
                    if(p.x < 0) p.x = particleCanvas.width;
                    if(p.x > particleCanvas.width) p.x = 0;
                    if(p.y < 0) p.y = particleCanvas.height;
                    if(p.y > particleCanvas.height) p.y = 0;
                }
                requestAnimationFrame(drawParticles);
            }
            drawParticles();
            
            // glitch effect loop
            function applyGlitch() {
                if(!glitchCtx || glitchIntensity <= 0.02) {
                    if(glitchCtx) glitchCtx.clearRect(0,0, glitchCanvas.width, glitchCanvas.height);
                    requestAnimationFrame(applyGlitch);
                    return;
                }
                glitchCtx.clearRect(0,0, glitchCanvas.width, glitchCanvas.height);
                const blocks = Math.floor(glitchIntensity * 35);
                for(let i=0;i<blocks;i++) {
                    const y = Math.random() * glitchCanvas.height;
                    const h = Math.random() * 30 + 8;
                    const offsetX = (Math.random() - 0.5) * 25 * glitchIntensity;
                    glitchCtx.fillStyle = `rgba(0,255,255,${Math.random() * 0.25})`;
                    glitchCtx.fillRect(0, y, glitchCanvas.width, h);
                    glitchCtx.fillStyle = `rgba(255,0,255,${Math.random() * 0.2})`;
                    glitchCtx.fillRect(offsetX, y, glitchCanvas.width * 0.2, h);
                }
                requestAnimationFrame(applyGlitch);
            }
            applyGlitch();
        }
        
        // skills progress animation
        function animateSkills() {
            const pythonFill = document.getElementById('pythonFill');
            const cppFill = document.getElementById('cppFill');
            const csFill = document.getElementById('csFill');
            if(pythonFill) pythonFill.style.width = '87%';
            if(cppFill) cppFill.style.width = '75%';
            if(csFill) csFill.style.width = '80%';
        }
        
        // theme logic + video / overlay color
        const themes = {
            neon: { video: 'https://assets.mixkit.co/videos/preview/mixkit-digital-circuit-animation-34871-large.mp4', borderColor: '#0ff', brightness: 0.6 },
            hacker: { video: 'https://cdn.pixabay.com/vimeo/404214130/matrix-14650.mp4?width=640&expiry=1712353646&hash=...', fallback: true, borderColor: '#0f0', brightness: 0.5 },
            rain: { video: 'https://assets.mixkit.co/videos/preview/mixkit-rain-on-window-4044-large.mp4', borderColor: '#87CEEB', brightness: 0.55 },
            anime: { video: 'https://assets.mixkit.co/videos/preview/mixkit-night-city-with-neon-lights-1169-large.mp4', borderColor: '#ff66cc', brightness: 0.6 },
            car: { video: 'https://assets.mixkit.co/videos/preview/mixkit-red-sports-car-on-night-road-3366-large.mp4', borderColor: '#ffa500', brightness: 0.55 }
        };
        
        function setTheme(themeKey) {
            const theme = themes[themeKey];
            if(theme) {
                if(theme.video) bgVideo.src = theme.video;
                bgVideo.play().catch(e=>console.log);
                bgVideo.style.filter = `brightness(${theme.brightness}) saturate(1.2)`;
                document.documentElement.style.setProperty('--primary-glow', theme.borderColor);
                mainPanel.style.borderColor = theme.borderColor;
                const btns = document.querySelectorAll('.theme-dot');
                btns.forEach(btn => {
                    if(btn.getAttribute('data-theme') === themeKey) btn.classList.add('active');
                    else btn.classList.remove('active');
                });
            }
        }
        
        themeBtns.forEach(btn => {
            btn.addEventListener('click', () => {
                const t = btn.getAttribute('data-theme');
                setTheme(t);
            });
        });
        
        // entry screen removal
        entryScreen.addEventListener('click', () => {
            entryScreen.style.opacity = '0';
            setTimeout(() => {
                entryScreen.classList.add('hidden');
                mainPanel.classList.add('visible');
                bgAudio.volume = volumeSlider.value;
                bgAudio.play().catch(e=>console.log);
                gsap.from(mainPanel, { duration: 0.8, y: 30, opacity: 0, ease: "back.out(0.4)" });
                animateSkills();
                initCanvas();
            }, 600);
        });
        
        // volume control
        volumeSlider.addEventListener('input', (e) => {
            bgAudio.volume = parseFloat(e.target.value);
        });
        
        glitchSlider.addEventListener('input', (e) => {
            glitchIntensity = parseFloat(e.target.value);
        });
        
        // toggle skills panel
        skillsToggle.addEventListener('click', () => {
            if(skillsWrapper.classList.contains('hidden')) {
                skillsWrapper.classList.remove('hidden');
                animateSkills();
                skillsToggle.textContent = '▼ HIDE SKILLS';
            } else {
                skillsWrapper.classList.add('hidden');
                skillsToggle.textContent = '▣ TOGGLE SKILLS';
            }
        });
        
        // cursor movement
        const cursor = document.querySelector('.custom-cursor');
        document.addEventListener('mousemove', (e) => {
            if(cursor) {
                cursor.style.left = e.clientX + 'px';
                cursor.style.top = e.clientY + 'px';
            }
        });
        
        document.body.classList.add('touch-device'); // disable cursor on touch
        if(window.matchMedia("(pointer: fine)").matches) {
            document.body.classList.remove('touch-device');
        } else {
            document.body.classList.add('touch-device');
            if(cursor) cursor.style.display = 'none';
        }
        
        // fallback for video sources if any error (avoid broken video)
        bgVideo.onerror = () => {
            bgVideo.src = 'https://assets.mixkit.co/videos/preview/mixkit-digital-circuit-animation-34871-large.mp4';
        };
        // set default neon
        setTheme('neon');
        // preload audio metadata
        bgAudio.load();
    </script>
</body>
</html>
