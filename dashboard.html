<!DOCTYPE html>
<html>
<head>
    <title>Dashboard</title>
    <script src="https://unpkg.com/@supabase/supabase-js@2.38.0"></script>
    <style>
        body { background: black; color: white; padding: 20px; font-family: Arial; }
        .container { max-width: 800px; margin: 0 auto; }
        button { background: white; color: black; padding: 10px 20px; border: none; border-radius: 6px; cursor: pointer; margin: 10px; }
        button:hover { background: #ddd; }
        .error { color: red; margin: 20px 0; padding: 10px; background: rgba(255,0,0,0.1); border-radius: 6px; }
        .success { color: green; margin: 20px 0; padding: 10px; background: rgba(0,255,0,0.1); border-radius: 6px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Dashboard</h1>
        <div id="content">Loading...</div>
        <button onclick="logout()">Logout</button>
    </div>
    
    <script>
        // ⚠️ PUT YOUR REAL CREDENTIALS HERE ⚠️
        const SUPABASE_URL = 'https://kleonejdkmalzkgehhgt.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImtsZW9uZWpka21hbHprZ2VoaGd0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjczODc1MjksImV4cCI6MjA4Mjk2MzUyOX0.5YmLdNK_-1ZydX6tVOXBFMmv9IChj8Ta8O-WLYERDQw';
        
        const { createClient } = window.supabase;
        const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        
        async function loadDashboard() {
            try {
                const { data: { session }, error } = await supabase.auth.getSession();
                
                if (error || !session) {
                    window.location.href = 'login.html';
                    return;
                }
                
                const { data: profile } = await supabase
                    .from('profiles')
                    .select('*')
                    .eq('id', session.user.id)
                    .single();
                
                document.getElementById('content').innerHTML = `
                    <h2>Welcome, ${profile?.username || session.user.email}!</h2>
                    <p>Your profile: socialanxiety.lol/${profile?.username || 'username'}</p>
                    <p>Email: ${session.user.email}</p>
                    <p>User ID: ${session.user.id}</p>
                `;
                
            } catch (error) {
                document.getElementById('content').innerHTML = 
                    `<div class="error">Error: ${error.message}</div>`;
            }
        }
        
        async function logout() {
            await supabase.auth.signOut();
            window.location.href = 'index.html';
        }
        
        loadDashboard();
    </script>
</body>
</html>
