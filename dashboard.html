<!DOCTYPE html>
<html>
<head>
    <title>Dashboard</title>
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
    <script>
        const SUPABASE_URL = 'https://YOUR-PROJECT-ID.supabase.co';
        const SUPABASE_ANON_KEY = 'YOUR-ANON-KEY';
        const { createClient } = window.supabase;
        const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    </script>
    <style>
        body { background: black; color: white; padding: 20px; font-family: sans-serif; }
        button { padding: 10px 20px; background: white; color: black; border: none; border-radius: 6px; cursor: pointer; }
        button:hover { background: #ddd; }
    </style>
</head>
<body>
    <h1>Dashboard</h1>
    <div id="content">Loading...</div>
    <button onclick="logout()">Logout</button>
    
    <script>
        async function checkAuth() {
            const { data: { session } } = await supabase.auth.getSession();
            if (!session) {
                window.location.href = 'login.html';
                return;
            }
            
            const { data: profile } = await supabase
                .from('profiles')
                .select('*')
                .eq('id', session.user.id)
                .single();
            
            document.getElementById('content').innerHTML = `
                <h2>Welcome ${profile?.username || 'User'}!</h2>
                <p>Email: ${session.user.email}</p>
                <p>Your profile: socialanxiety.lol/${profile?.username || 'username'}</p>
            `;
        }
        
        async function logout() {
            await supabase.auth.signOut();
            window.location.href = 'index.html';
        }
        
        checkAuth();
    </script>
</body>
</html>
