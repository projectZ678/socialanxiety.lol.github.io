        * {

            padding: 0;

        }

            background: var(--bg-dark);
            color: var(--text-primary);

        /* Particles Canvas */

            left: 0;

        /* Navigation */
        .navbar {

            justify-content: space-between;
            align-items: center;
            padding: 20px 40px;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 100;
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--border-color);

        .logo {

            font-weight: 700;
        }

        .logo span {

            -webkit-text-fill-color: transparent;
            letter-spacing: 2px;

        }

        .nav-links {

            gap: 16px;
        }

        .nav-btn {

            border-radius: 12px;
            text-decoration: none;
            font-size: 14px;
            font-weight: 500;
            letter-spacing: 1px;
            transition: all 0.3s ease;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: var(--text-primary);
            cursor: pointer;
            border: none;
            font-family: inherit;
        }

        .nav-btn.secondary {

            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .nav-btn:hover {
            background: rgba(255, 255, 255, 0.15);
            transform: translateY(-2px);
        }

        .dashboard-container {
            display: flex;
            min-height: calc(100vh - 80px);

            position: relative;
            z-index: 2;
        }

        /* Sidebar */

            background: rgba(15, 15, 15, 0.9);
            backdrop-filter: blur(20px);
            border-right: 1px solid var(--border-color);
            padding: 20px;
            display: flex;
            flex-direction: column;
        }

        .sidebar-nav {

            margin-top: 40px;

        .nav-item {

            align-items: center;
            padding: 16px;
            margin-bottom: 12px;
            border-radius: 12px;
            text-decoration: none;
            color: var(--text-secondary);

        .nav-item i {

        .user-profile {

            align-items: center;

        }

        @keyframes slideIn {
            from { transform: translateX(100%); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }

        @keyframes slideOut {
            from { transform: translateX(0); opacity: 1; }
            to { transform: translateX(100%); opacity: 0; }
        }
    </style>
</head>

        // === PARTICLES SYSTEM ===
        function initParticles() {
            const canvas = document.getElementById('particlesCanvas');
            if (!canvas) return;
            
            const ctx = canvas.getContext('2d');
            
            function resizeCanvas() {
                canvas.width = window.innerWidth;
                canvas.height = window.innerHeight;
            }
            
            resizeCanvas();
            window.addEventListener('resize', resizeCanvas);
            
            class Particle {
                constructor() {
                    this.x = Math.random() * canvas.width;
                    this.y = Math.random() * canvas.height;
                    this.size = Math.random() * 1.8 + 0.4;
                    this.vx = Math.random() * 0.4 - 0.2;
                    this.vy = Math.random() * 0.4 - 0.2;
                    this.o = Math.random() * 0.4 + 0.15;
                    this.color = Math.random() > 0.8 ? 
                        `rgba(180, 180, 255, ${this.o})` : 
                        `rgba(255, 255, 255, ${this.o})`;
                }
                
                update() {
                    this.x += this.vx;
                    this.y += this.vy;
                    
                    if (this.x < 0 || this.x > canvas.width) this.vx *= -1;
                    if (this.y < 0 || this.y > canvas.height) this.vy *= -1;
                }
                
                draw() {
                    ctx.fillStyle = this.color;
                    ctx.beginPath();
                    ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                    ctx.fill();
                }
            }
            
            // Create particles
            for (let i = 0; i < 100; i++) {
                particles.push(new Particle());
            }
            
            function animate() {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                
                particles.forEach(particle => {
                    particle.update();
                    particle.draw();
                });
                
                requestAnimationFrame(animate);
            }
            
            animate();
        }

                    break;
                    
                case 'music':
                    modalContainer.innerHTML = `
                        <div class="modal" id="musicModal">
                            <div class="modal-content">
                                <div class="modal-header">
                                    <h2>Background Music</h2>
                                    <button class="modal-close" onclick="closeModal()">&times;</button>
                                </div>
                                <div class="modal-body">
                                    <div style="margin-bottom: 20px; padding: 20px; background: rgba(255,255,255,0.05); border-radius: 12px; text-align: center;">
                                        <p id="musicStatus">${currentUser.customizations?.music_url ? 'Music is set' : 'No music set'}</p>
                                    </div>
                                    <div class="form-group">
                                        <label class="form-label">Music URL (MP3, WAV, etc.)</label>
                                        <input type="text" id="musicUrl" class="form-input" placeholder="https://example.com/music.mp3" value="${currentUser.customizations?.music_url || ''}">
                                        <p style="font-size: 12px; opacity: 0.7; margin-top: 8px;">Direct link to audio file</p>
                                    </div>
                                    <div style="display: flex; gap: 12px;">
                                        <button class="action-btn secondary" onclick="testMusic()" style="flex: 1;">Test</button>
                                        <button class="action-btn" onclick="saveMusic()" style="flex: 2;">Save Music</button>
                                    </div>
                                </div>
                            </div>
                        </div>
                    `;
                    break;
            }
            
            document.querySelector('.modal').style.display = 'flex';
        }

        function closeModal() {
            const modalContainer = document.getElementById('modalContainer');
            modalContainer.innerHTML = '';
        }

        // === UPDATE PROFILE FUNCTIONS ===
        async function updateProfile(data) {
            try {
                const response = await fetch(`${SUPABASE_URL}/rest/v1/profiles?user_id=eq.${currentUser.id}`, {
                    method: 'PATCH',
                    headers: {
                        'apikey': SUPABASE_ANON_KEY,
                        'Authorization': `Bearer ${SUPABASE_ANON_KEY}`,
                        'Content-Type': 'application/json',
                        'Prefer': 'return=representation'
                    },
                    body: JSON.stringify({
                        ...data,
                        updated_at: new Date().toISOString()
                    })
                });
                
                if (!response.ok) throw new Error('Failed to update profile');
                
                // Update local storage
                currentUser.customizations = { ...currentUser.customizations, ...data };
                localStorage.setItem('socialanxiety_user', JSON.stringify(currentUser));
                
                return true;
            } catch (error) {
                console.error('Error updating profile:', error);
                return false;
            }
        }

        async function saveCustomizations() {
            const pfpUrl = document.getElementById('customizePfpUrl').value.trim() || DEFAULT_PFP;
            const bio = document.getElementById('customizeBio').value.trim();
            
            const success = await updateProfile({
                pfp_url: pfpUrl,
                bio: bio
            });
            
            if (success) {
                // Update UI
                document.querySelectorAll('#sidebarAvatar, #dashboardAvatar').forEach(img => {
                    img.src = pfpUrl;
                });
                
                showNotification('Profile updated!');
                closeModal();
            } else {
                showNotification('Error updating profile', 'error');
            }
        }

        async function saveBanner() {
            const bannerUrl = document.getElementById('bannerUrl').value.trim() || DEFAULT_BANNER;
            
            const success = await updateProfile({
                banner_url: bannerUrl
            });
            
            if (success) {
                // Update UI
                document.getElementById('dashboardBanner').style.backgroundImage = `url(${bannerUrl})`;
                
                showNotification('Banner updated!');
                closeModal();
            } else {
                showNotification('Error updating banner', 'error');
            }
        }

        async function saveMusic() {
            const musicUrl = document.getElementById('musicUrl').value.trim();
            
            const success = await updateProfile({
                music_url: musicUrl
            });
            
            if (success) {
                showNotification('Music saved!');
                closeModal();
            } else {
                showNotification('Error updating music', 'error');
            }
        }

        function testMusic() {
            const musicUrl = document.getElementById('musicUrl').value.trim();
            if (musicUrl) {
                const audio = new Audio(musicUrl);
                audio.volume = 0.3;
                audio.play();
                showNotification('Playing music preview...');
            }
        }

        // === PROFILE FUNCTIONS ===
        function copyProfileLink() {
            const link = `${window.location.origin}/${currentUser.username}`;
            navigator.clipboard.writeText(link)
                .then(() => showNotification('Profile link copied!'))
                .catch(err => console.error('Failed to copy:', err));
        }

        function shareProfile() {
            const link = `${window.location.origin}/${currentUser.username}`;
            if (navigator.share) {
                navigator.share({
                    title: `Check out @${currentUser.username}'s profile!`,
                    text: 'Check out my profile on socialanxiety.lol',
                    url: link
                });
            } else {
                copyProfileLink();
            }
        }

        // === UTILITY FUNCTIONS ===
        function showNotification(message, type = 'success') {
            // Remove existing notifications
            document.querySelectorAll('.notification').forEach(n => n.remove());
            
            // Create notification element
            const notification = document.createElement('div');
            notification.className = `notification ${type === 'error' ? 'error' : ''}`;
            notification.textContent = message;
            document.body.appendChild(notification);
            
            // Auto remove
            setTimeout(() => {
                notification.style.animation = 'slideOut 0.3s ease';
                setTimeout(() => notification.remove(), 300);
            }, 3000);
        }

        function logout() {
            localStorage.removeItem('socialanxiety_user');
            showNotification('Logged out successfully');
            setTimeout(() => {
                window.location.href = '/';
            }, 1000);
        }

        // === INITIALIZE ===
        document.addEventListener('DOMContentLoaded', initDashboard);
    </script>
</body>
</html>
