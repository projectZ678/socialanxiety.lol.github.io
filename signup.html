<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - socialanxiety.lol</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: #000000;
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            overflow: hidden;
        }

        /* Background effect */
        .bg-dots {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: 
                radial-gradient(circle at 20% 20%, rgba(255, 255, 255, 0.02) 1px, transparent 1px),
                radial-gradient(circle at 80% 80%, rgba(255, 255, 255, 0.02) 1px, transparent 1px);
            background-size: 50px 50px, 30px 30px;
            animation: dotsFloat 30s linear infinite;
            opacity: 0.4;
        }

        @keyframes dotsFloat {
            0% { transform: translate(0, 0) rotate(0deg); }
            100% { transform: translate(50px, 50px) rotate(180deg); }
        }

        /* Back button */
        .back-btn {
            position: fixed;
            top: 2rem;
            left: 2rem;
            color: rgba(255, 255, 255, 0.5);
            text-decoration: none;
            font-size: 0.9rem;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            transition: color 0.3s ease;
            z-index: 10;
        }

        .back-btn:hover {
            color: #ffffff;
        }

        /* Signup container */
        .signup-container {
            width: 100%;
            max-width: 400px;
            padding: 2rem;
            position: relative;
            z-index: 2;
        }

        /* Header */
        .header {
            text-align: center;
            margin-bottom: 3rem;
        }

        .logo {
            font-size: 2rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
            letter-spacing: -1px;
        }

        .subtitle {
            color: rgba(255, 255, 255, 0.5);
            font-size: 0.9rem;
            font-weight: 400;
        }

        /* Form */
        .form {
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
        }

        .input-group {
            position: relative;
        }

        .input-label {
            display: block;
            margin-bottom: 0.5rem;
            font-size: 0.85rem;
            font-weight: 500;
            color: rgba(255, 255, 255, 0.8);
        }

        .input-field {
            width: 100%;
            padding: 1rem;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            color: #ffffff;
            font-size: 0.95rem;
            transition: all 0.3s ease;
        }

        .input-field:focus {
            outline: none;
            border-color: rgba(255, 255, 255, 0.3);
            background: rgba(255, 255, 255, 0.08);
        }

        .input-field::placeholder {
            color: rgba(255, 255, 255, 0.3);
        }

        /* URL Preview */
        .url-preview {
            margin-top: 0.5rem;
            padding: 0.5rem;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 6px;
            font-size: 0.85rem;
            color: rgba(255, 255, 255, 0.6);
        }

        .url-preview .username {
            color: #ffffff;
            font-weight: 600;
        }

        /* Submit button */
        .submit-btn {
            width: 100%;
            padding: 1rem;
            background: #ffffff;
            color: #000000;
            border: none;
            border-radius: 8px;
            font-size: 0.9rem;
            font-weight: 600;
            letter-spacing: 1px;
            text-transform: uppercase;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 1rem;
        }

        .submit-btn:hover {
            background: rgba(255, 255, 255, 0.9);
            transform: translateY(-2px);
        }

        /* Links */
        .links {
            text-align: center;
            margin-top: 2rem;
            padding-top: 2rem;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
        }

        .link-text {
            color: rgba(255, 255, 255, 0.5);
            font-size: 0.85rem;
        }

        .link {
            color: #ffffff;
            text-decoration: none;
            font-weight: 500;
            transition: color 0.3s ease;
        }

        .link:hover {
            color: rgba(255, 255, 255, 0.8);
        }

        /* Form line animation */
        .form-line {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 1px;
            background: linear-gradient(90deg, 
                transparent, 
                rgba(255, 255, 255, 0.3), 
                transparent);
            transform: scaleX(0);
            transform-origin: left;
            transition: transform 0.3s ease;
        }

        .input-field:focus + .form-line {
            transform: scaleX(1);
        }

        /* Input effects */
        @keyframes inputGlow {
            0% { box-shadow: 0 0 0 0 rgba(255, 255, 255, 0.1); }
            50% { box-shadow: 0 0 0 2px rgba(255, 255, 255, 0.1); }
            100% { box-shadow: 0 0 0 0 rgba(255, 255, 255, 0.1); }
        }

        .input-field:focus {
            animation: inputGlow 0.5s ease;
        }

        /* Loading animation for submit */
        @keyframes loading {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .loading .submit-btn::after {
            content: '';
            display: inline-block;
            width: 16px;
            height: 16px;
            margin-left: 10px;
            border: 2px solid #000000;
            border-top-color: transparent;
            border-radius: 50%;
            animation: loading 0.6s linear infinite;
        }
    </style>
</head>
<body>
    <div class="bg-dots"></div>
    
    <a href="index.html" class="back-btn">
        ← BACK
    </a>

    <div class="signup-container">
        <div class="header">
            <div class="logo">socialanxiety.lol</div>
            <div class="subtitle">Create your account</div>
        </div>

        <form class="form" id="signupForm">
            <div class="input-group">
                <label class="input-label">USERNAME</label>
                <input type="text" class="input-field" id="username" placeholder="Choose a username" required>
                <div class="form-line"></div>
                <div class="url-preview">
                    socialanxiety.lol/<span class="username" id="usernamePreview">username</span>
                </div>
            </div>

            <div class="input-group">
                <label class="input-label">EMAIL</label>
                <input type="email" class="input-field" placeholder="Enter your email" required>
                <div class="form-line"></div>
            </div>

            <div class="input-group">
                <label class="input-label">PASSWORD</label>
                <input type="password" class="input-field" placeholder="Create a password" required>
                <div class="form-line"></div>
            </div>

            <button type="submit" class="submit-btn">CREATE ACCOUNT</button>
        </form>

        <div class="links">
            <span class="link-text">Already have an account?</span>
            <a href="login.html" class="link"> LOGIN</a>
        </div>
    </div>

    <script>
        // Update URL preview as user types username
        const usernameInput = document.getElementById('username');
        const usernamePreview = document.getElementById('usernamePreview');
        
        usernameInput.addEventListener('input', function(e) {
            usernamePreview.textContent = e.target.value || 'username';
        });

        // Form submission
        document.getElementById('signupForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            // Add loading state
            const submitBtn = this.querySelector('.submit-btn');
            const originalText = submitBtn.textContent;
            submitBtn.textContent = 'CREATING...';
            submitBtn.disabled = true;
            
            // Here you would normally handle signup with Supabase
            // For now, simulate API call
            setTimeout(() => {
                window.location.href = 'dashboard.html';
            }, 1000);
        });

        // Add input focus effects
        const inputs = document.querySelectorAll('.input-field');
        inputs.forEach(input => {
            input.addEventListener('focus', function() {
                this.parentElement.querySelector('.form-line').style.transform = 'scaleX(1)';
            });
            
            input.addEventListener('blur', function() {
                if (!this.value) {
                    this.parentElement.querySelector('.form-line').style.transform = 'scaleX(0)';
                }
            });
        });
    </script>
</body>
</html>
