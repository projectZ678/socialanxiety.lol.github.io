    <style>

<body>
    <a href="index.html" class="back-link">← Back</a>
    
    <div class="container">
        <div class="card">
            <div class="logo">
                <h1>socialanxiety.lol</h1>
                <p>Create your account</p>
            </div>

            <form id="signupForm">
                <div class="form-group">
                    <label>Username</label>
                    <input type="text" id="username" placeholder="username" required>
                    <div class="url-preview">
                        socialanxiety.lol/<span class="highlight" id="usernamePreview">username</span>
                    </div>
                </div>

                <div class="form-group">
                    <label>Email</label>
                    <input type="email" id="email" placeholder="your@email.com" required>
                </div>

                <div class="form-group">
                    <label>Password</label>
                    <input type="password" id="password" placeholder="min 8 characters" required minlength="8">
                </div>

                <div id="error" class="error"></div>
                <div id="success" class="success"></div>

                <button type="submit" id="submitBtn">Create Account</button>
            </form>

            <div class="login-link">
                Already have an account? <a href="login.html">Login here</a>
            </div>
        </div>
    </div>

    <script>
        // Update username preview
        document.getElementById('username').addEventListener('input', function(e) {
            const username = e.target.value.toLowerCase().replace(/[^a-z0-9_]/g, '');
            e.target.value = username;
            document.getElementById('usernamePreview').textContent = username || 'username';
        });

        // Form submission
        document.getElementById('signupForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const username = document.getElementById('username').value.trim().toLowerCase();
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            const errorEl = document.getElementById('error');
            const successEl = document.getElementById('success');
            const submitBtn = document.getElementById('submitBtn');
            
            // Clear messages
            errorEl.style.display = 'none';
            successEl.style.display = 'none';
            errorEl.textContent = '';
            successEl.textContent = '';
            
            // Validate
            if (!/^[a-z0-9_]{3,20}$/.test(username)) {
                showError('Username: 3-20 letters/numbers/underscores only');
                return;
            }
            
            // Disable button
            submitBtn.disabled = true;
            submitBtn.textContent = 'Creating...';
            
            try {
                console.log('Starting signup...');
                
                // 1. Check if username exists
                console.log('Checking username:', username);
                const { data: existing, error: checkError } = await supabase
                    .from('profiles')
                    .select('username')
                    .eq('username', username)
                    .maybeSingle();
                
                if (checkError) console.error('Check error:', checkError);
                
                if (existing) {
                    throw new Error('Username taken');
                }
                
                // 2. Create auth user
                console.log('Creating auth user...');
                const { data: authData, error: authError } = await supabase.auth.signUp({
                    email: email,
                    password: password,
                    options: {
                        data: { username: username }
                    }
                });
                
                if (authError) throw authError;
                if (!authData.user) throw new Error('No user created');
                
                console.log('User created:', authData.user.id);
                
                // 3. Create profile
                console.log('Creating profile...');
                const { error: profileError } = await supabase
                    .from('profiles')
                    .insert([
                        {
                            id: authData.user.id,
                            username: username,
                            email: email,
                            bio: '',
                            created_at: new Date().toISOString()
                        }
                    ]);
                
                if (profileError) {
                    console.error('Profile error:', profileError);
                    // Try to clean up
                    try {
                        await supabase.auth.admin.deleteUser(authData.user.id);
                    } catch (e) {
                        console.error('Cleanup failed:', e);
                    }
                    throw profileError;
                }
                
                console.log('Profile created!');
                
                // Success
                successEl.textContent = '✓ Account created! Redirecting...';
                successEl.style.display = 'block';
                
                // Store session
                localStorage.setItem('user', JSON.stringify({
                    id: authData.user.id,
                    email: authData.user.email,
                    username: username
                }));
                
                // Redirect
                setTimeout(() => {
                    window.location.href = 'dashboard.html';
                }, 1500);
                
            } catch (error) {
                console.error('Signup failed:', error);
                
                let message = error.message;
                if (message.includes('already registered')) {
                    message = 'Email already registered. Login instead.';
                } else if (message.includes('Password')) {
                    message = 'Password must be at least 8 characters.';
                } else if (message.includes('Invalid')) {
                    message = 'Invalid email format.';
                } else if (message.includes('taken')) {
                    message = 'Username taken. Try another.';
                }
                
                showError(message);
                submitBtn.disabled = false;
                submitBtn.textContent = 'Create Account';
            }
        });

        function showError(message) {
            const errorEl = document.getElementById('error');
            errorEl.textContent = message;
            errorEl.style.display = 'block';
        }

        // Check if already logged in
        document.addEventListener('DOMContentLoaded', async () => {
            try {
                const { data: { session } } = await supabase.auth.getSession();
                if (session) {
                    window.location.href = 'dashboard.html';
                }
            } catch (error) {
                console.log('No session found');
            }
        });
    </script>
</body>
