<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - socialanxiety.lol</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
    <script src="supabase-config.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: #000000;
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 2rem;
        }

        .signup-container {
            width: 100%;
            max-width: 400px;
        }

        .back-link {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            color: #666;
            text-decoration: none;
            font-size: 0.9rem;
            margin-bottom: 2rem;
            transition: color 0.3s ease;
        }

        .back-link:hover {
            color: #ffffff;
        }

        .signup-card {
            background: rgba(15, 15, 15, 0.95);
            border: 1px solid #333;
            border-radius: 20px;
            padding: 2.5rem;
            box-shadow: 0 10px 30px rgba(255, 255, 255, 0.05);
            position: relative;
            overflow: hidden;
        }

        .signup-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 2px;
            background: linear-gradient(90deg, 
                transparent, 
                #ffffff, 
                transparent);
        }

        .signup-header {
            text-align: center;
            margin-bottom: 2rem;
        }

        .signup-logo {
            font-size: 1.8rem;
            font-weight: 700;
            color: #ffffff;
            margin-bottom: 0.5rem;
            letter-spacing: -0.5px;
        }

        .signup-title {
            font-size: 1.5rem;
            font-weight: 600;
            color: #ffffff;
            margin-bottom: 0.5rem;
        }

        .signup-subtitle {
            color: #666;
            font-size: 0.9rem;
        }

        .signup-form {
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
        }

        .form-group {
            position: relative;
        }

        .form-label {
            display: block;
            margin-bottom: 0.5rem;
            color: #999;
            font-size: 0.85rem;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .form-input {
            width: 100%;
            padding: 1rem;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid #333;
            border-radius: 10px;
            color: #ffffff;
            font-size: 1rem;
            transition: all 0.3s ease;
        }

        .form-input:focus {
            outline: none;
            border-color: #ffffff;
            background: rgba(255, 255, 255, 0.08);
        }

        .url-preview {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid #333;
            border-radius: 8px;
            padding: 0.8rem;
            margin-top: 0.5rem;
            font-family: monospace;
            color: #999;
            font-size: 0.9rem;
        }

        .url-preview .username {
            color: #ffffff;
            font-weight: 600;
        }

        .submit-btn {
            width: 100%;
            padding: 1rem;
            background: #ffffff;
            color: #000000;
            border: none;
            border-radius: 10px;
            font-size: 0.9rem;
            font-weight: 600;
            letter-spacing: 2px;
            text-transform: uppercase;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 1rem;
        }

        .submit-btn:hover {
            background: rgba(255, 255, 255, 0.9);
            transform: translateY(-2px);
        }

        .submit-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        .form-footer {
            text-align: center;
            margin-top: 2rem;
            padding-top: 2rem;
            border-top: 1px solid #333;
        }

        .form-link {
            color: #ffffff;
            text-decoration: none;
            font-weight: 600;
            transition: opacity 0.3s ease;
        }

        .form-link:hover {
            opacity: 0.8;
        }

        .error-message {
            color: #ff6b6b;
            font-size: 0.85rem;
            margin-top: 0.5rem;
            text-align: center;
            display: none;
        }

        .success-message {
            color: #51cf66;
            font-size: 0.85rem;
            margin-top: 0.5rem;
            text-align: center;
            display: none;
        }
    </style>
</head>
<body>
    <div class="signup-container">
        <a href="index.html" class="back-link">← Back to home</a>
        
        <div class="signup-card">
            <div class="signup-header">
                <div class="signup-logo">socialanxiety.lol</div>
                <h1 class="signup-title">Create Account</h1>
                <p class="signup-subtitle">Get your personal profile URL</p>
            </div>

            <form class="signup-form" id="signupForm">
                <div class="form-group">
                    <label class="form-label">Username</label>
                    <input type="text" id="username" class="form-input" placeholder="Choose a username" required>
                    <div class="url-preview">
                        socialanxiety.lol/<span class="username" id="usernamePreview">username</span>
                    </div>
                </div>

                <div class="form-group">
                    <label class="form-label">Email</label>
                    <input type="email" id="email" class="form-input" placeholder="your@email.com" required>
                </div>

                <div class="form-group">
                    <label class="form-label">Password</label>
                    <input type="password" id="password" class="form-input" placeholder="Create a password (min 8 chars)" required minlength="8">
                </div>

                <div id="errorMessage" class="error-message"></div>
                <div id="successMessage" class="success-message"></div>

                <button type="submit" class="submit-btn" id="submitBtn">CREATE ACCOUNT</button>
            </form>

            <div class="form-footer">
                <p>Already have an account? <a href="login.html" class="form-link">Login</a></p>
            </div>
        </div>
    </div>

    <script>
        const supabase = window.supabase;
        
        // Update username preview
        document.getElementById('username').addEventListener('input', function(e) {
            document.getElementById('usernamePreview').textContent = e.target.value.toLowerCase() || 'username';
        });
        
        document.getElementById('signupForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const username = document.getElementById('username').value.trim().toLowerCase();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const errorEl = document.getElementById('errorMessage');
            const successEl = document.getElementById('successMessage');
            const submitBtn = document.getElementById('submitBtn');
            
            // Clear messages
            errorEl.style.display = 'none';
            successEl.style.display = 'none';
            errorEl.textContent = '';
            successEl.textContent = '';
            
            // Validate username
            if (!/^[a-z0-9_]{3,20}$/.test(username)) {
                errorEl.textContent = 'Username must be 3-20 characters (lowercase letters, numbers, underscores only)';
                errorEl.style.display = 'block';
                return;
            }
            
            // Disable button
            submitBtn.disabled = true;
            submitBtn.textContent = 'CREATING ACCOUNT...';
            
            try {
                // Check if username exists
                const { data: existingUser } = await supabase
                    .from('profiles')
                    .select('username')
                    .eq('username', username)
                    .single();
                
                if (existingUser) {
                    throw new Error('Username already taken');
                }
                
                // Create auth user
                const { data: authData, error: authError } = await supabase.auth.signUp({
                    email: email,
                    password: password,
                    options: {
                        data: {
                            username: username
                        }
                    }
                });
                
                if (authError) throw authError;
                
                // Create profile in database
                const { error: profileError } = await supabase
                    .from('profiles')
                    .insert([
                        {
                            id: authData.user.id,
                            username: username,
                            email: email,
                            bio: '',
                            avatar_url: null,
                            banner_url: null,
                            mp3_url: null,
                            created_at: new Date().toISOString()
                        }
                    ]);
                
                if (profileError) {
                    // If profile creation fails, delete the auth user
                    await supabase.auth.admin.deleteUser(authData.user.id);
                    throw profileError;
                }
                
                // Success
                successEl.textContent = 'Account created successfully! Redirecting...';
                successEl.style.display = 'block';
                
                // Store user session
                localStorage.setItem('user', JSON.stringify({
                    id: authData.user.id,
                    email: authData.user.email,
                    username: username
                }));
                
                // Redirect to dashboard
                setTimeout(() => {
                    window.location.href = 'dashboard.html';
                }, 1500);
                
            } catch (error) {
                // Show error
                errorEl.textContent = error.message;
                errorEl.style.display = 'block';
                submitBtn.disabled = false;
                submitBtn.textContent = 'CREATE ACCOUNT';
            }
        });

        // Check if user is already logged in
        document.addEventListener('DOMContentLoaded', async () => {
            const { data: { session } } = await supabase.auth.getSession();
            if (session) {
                window.location.href = 'dashboard.html';
            }
        });
    </script>
</body>
</html>
