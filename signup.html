<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - socialanxiety.lol</title>
    <!-- Load Supabase FIRST -->
    <script src="https://unpkg.com/@supabase/supabase-js@2.38.0"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, sans-serif;
        }
        
        body {
            background: #000000;
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        
        .container {
            width: 100%;
            max-width: 420px;
        }
        
        .back-link {
            display: block;
            color: #888;
            text-decoration: none;
            margin-bottom: 30px;
            font-size: 14px;
        }
        
        .back-link:hover {
            color: #fff;
        }
        
        .card {
            background: #111111;
            border: 1px solid #333333;
            border-radius: 12px;
            padding: 40px 30px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }
        
        .logo {
            text-align: center;
            margin-bottom: 30px;
        }
        
        .logo h1 {
            font-size: 32px;
            font-weight: 800;
            background: linear-gradient(135deg, #fff 0%, #aaa 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 10px;
        }
        
        .logo p {
            color: #888;
            font-size: 14px;
        }
        
        .form-group {
            margin-bottom: 20px;
        }
        
        label {
            display: block;
            margin-bottom: 8px;
            color: #aaa;
            font-size: 13px;
            font-weight: 600;
            text-transform: uppercase;
        }
        
        input {
            width: 100%;
            padding: 14px;
            background: rgba(255,255,255,0.05);
            border: 1px solid #333;
            border-radius: 8px;
            color: #fff;
            font-size: 15px;
        }
        
        input:focus {
            outline: none;
            border-color: #666;
            background: rgba(255,255,255,0.08);
        }
        
        .url-preview {
            background: rgba(255,255,255,0.03);
            border: 1px solid #333;
            border-radius: 6px;
            padding: 10px;
            margin-top: 10px;
            font-family: monospace;
            font-size: 14px;
            color: #888;
        }
        
        .highlight {
            color: #fff;
            font-weight: 600;
        }
        
        .error {
            background: rgba(255, 50, 50, 0.1);
            border: 1px solid rgba(255, 50, 50, 0.3);
            border-radius: 8px;
            padding: 12px;
            margin: 20px 0;
            color: #ff3232;
            font-size: 14px;
            display: none;
        }
        
        .success {
            background: rgba(50, 255, 50, 0.1);
            border: 1px solid rgba(50, 255, 50, 0.3);
            border-radius: 8px;
            padding: 12px;
            margin: 20px 0;
            color: #32ff32;
            font-size: 14px;
            display: none;
        }
        
        button {
            width: 100%;
            padding: 16px;
            background: #fff;
            color: #000;
            border: none;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            margin-top: 10px;
        }
        
        button:hover {
            background: #f0f0f0;
        }
        
        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        
        .login-link {
            text-align: center;
            margin-top: 25px;
            color: #888;
            font-size: 14px;
        }
        
        .login-link a {
            color: #fff;
            text-decoration: none;
            font-weight: 600;
        }
    </style>
</head>
<body>
    <div class="container">
        <a href="index.html" class="back-link">← Back to Home</a>
        
        <div class="card">
            <div class="logo">
                <h1>socialanxiety.lol</h1>
                <p>Create your account</p>
            </div>

            <form id="signupForm">
                <div class="form-group">
                    <label>Username</label>
                    <input type="text" id="username" placeholder="username" required>
                    <div class="url-preview">
                        socialanxiety.lol/<span class="highlight" id="usernamePreview">username</span>
                    </div>
                </div>

                <div class="form-group">
                    <label>Email</label>
                    <input type="email" id="email" placeholder="your@email.com" required>
                </div>

                <div class="form-group">
                    <label>Password</label>
                    <input type="password" id="password" placeholder="minimum 8 characters" required minlength="8">
                </div>

                <div id="error" class="error"></div>
                <div id="success" class="success"></div>

                <button type="submit" id="submitBtn">Create Account</button>
            </form>

            <div class="login-link">
                Already have an account? <a href="login.html">Login here</a>
            </div>
        </div>
    </div>

    <script>
        // ⚠️ PUT YOUR REAL CREDENTIALS HERE ⚠️
        const SUPABASE_URL = 'https://kleonejdkmalzkgehhgt.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImtsZW9uZWpka21hbHprZ2VoaGd0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjczODc1MjksImV4cCI6MjA4Mjk2MzUyOX0.5YmLdNK_-1ZydX6tVOXBFMmv9IChj8Ta8O-WLYERDQw';
        
        // Initialize Supabase
        let supabase;
        
        function initSupabase() {
            try {
                if (!window.supabase) {
                    throw new Error('Supabase not loaded. Check internet connection.');
                }
                
                const { createClient } = window.supabase;
                supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
                console.log('Supabase initialized');
                return true;
            } catch (error) {
                console.error('Failed to init Supabase:', error);
                showError('Failed to load Supabase. Please refresh the page.');
                return false;
            }
        }
        
        // Update username preview
        document.getElementById('username').addEventListener('input', function(e) {
            const username = e.target.value.toLowerCase().replace(/[^a-z0-9_]/g, '');
            e.target.value = username;
            document.getElementById('usernamePreview').textContent = username || 'username';
        });
        
        // Form submission
        document.getElementById('signupForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            if (!initSupabase()) {
                showError('Supabase not initialized. Please refresh.');
                return;
            }
            
            const username = document.getElementById('username').value.trim().toLowerCase();
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            const errorEl = document.getElementById('error');
            const successEl = document.getElementById('success');
            const submitBtn = document.getElementById('submitBtn');
            
            // Clear messages
            errorEl.style.display = 'none';
            successEl.style.display = 'none';
            errorEl.textContent = '';
            successEl.textContent = '';
            
            // Validate
            if (!/^[a-z0-9_]{3,20}$/.test(username)) {
                showError('Username must be 3-20 characters (letters, numbers, underscores only)');
                return;
            }
            
            // Disable button
            submitBtn.disabled = true;
            submitBtn.textContent = 'Creating Account...';
            
            try {
                console.log('Starting signup process...');
                
                // 1. Check if username exists
                console.log('Checking username availability...');
                const { data: existing } = await supabase
                    .from('profiles')
                    .select('username')
                    .eq('username', username)
                    .maybeSingle();
                
                if (existing) {
                    throw new Error('Username already taken. Please choose another.');
                }
                
                // 2. Create auth user
                console.log('Creating user in auth...');
                const { data: authData, error: authError } = await supabase.auth.signUp({
                    email: email,
                    password: password,
                    options: {
                        data: {
                            username: username
                        }
                    }
                });
                
                if (authError) throw authError;
                
                if (!authData.user) {
                    throw new Error('Failed to create user account.');
                }
                
                console.log('User created:', authData.user.id);
                
                // 3. Create profile
                console.log('Creating profile...');
                const { error: profileError } = await supabase
                    .from('profiles')
                    .insert([
                        {
                            id: authData.user.id,
                            username: username,
                            email: email,
                            bio: '',
                            created_at: new Date().toISOString()
                        }
                    ]);
                
                if (profileError) {
                    console.error('Profile error:', profileError);
                    
                    // Try to delete the auth user
                    try {
                        // Note: This requires admin privileges. For now, just show error.
                        console.log('Profile creation failed. User may need to contact support.');
                    } catch (deleteError) {
                        console.error('Cleanup failed:', deleteError);
                    }
                    
                    throw profileError;
                }
                
                console.log('Signup successful!');
                
                // Success!
                successEl.textContent = 'Account created successfully! Redirecting to dashboard...';
                successEl.style.display = 'block';
                
                // Store in localStorage
                localStorage.setItem('user', JSON.stringify({
                    id: authData.user.id,
                    email: authData.user.email,
                    username: username
                }));
                
                // Redirect to dashboard after 2 seconds
                setTimeout(() => {
                    window.location.href = 'dashboard.html';
                }, 2000);
                
            } catch (error) {
                console.error('Signup error:', error);
                
                let errorMessage = error.message;
                
                // User-friendly error messages
                if (errorMessage.includes('already registered')) {
                    errorMessage = 'This email is already registered. Please login instead.';
                } else if (errorMessage.includes('Password')) {
                    errorMessage = 'Password must be at least 8 characters.';
                } else if (errorMessage.includes('Invalid email')) {
                    errorMessage = 'Please enter a valid email address.';
                } else if (errorMessage.includes('rate limit')) {
                    errorMessage = 'Too many attempts. Please wait a moment.';
                }
                
                showError(errorMessage);
                submitBtn.disabled = false;
                submitBtn.textContent = 'Create Account';
            }
        });
        
        function showError(message) {
            const errorEl = document.getElementById('error');
            errorEl.textContent = message;
            errorEl.style.display = 'block';
        }
        
        function showSuccess(message) {
            const successEl = document.getElementById('success');
            successEl.textContent = message;
            successEl.style.display = 'block';
        }
        
        // Initialize on load
        document.addEventListener('DOMContentLoaded', function() {
            console.log('Page loaded');
            initSupabase();
        });
    </script>
</body>
</html>
