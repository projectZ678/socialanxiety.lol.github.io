<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - socialanxiety.lol</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* Copy all your signup CSS here */
        :root {
            /* Same variables */
        }
        
        /* All the form styles */
    </style>
</head>
<body>
    <!-- Particles -->
    <canvas id="particlesCanvas"></canvas>

    <!-- Signup Form -->
    <div class="form-container">
        <div class="form-card">
            <div class="form-header">
                <div class="logo">
                    <a href="/">socialanxiety.lol</a>
                </div>
                <h1 class="form-title">CREATE PROFILE</h1>
                <p class="form-subtitle">Claim your unique link</p>
            </div>

            <form id="signupForm">
                <div class="form-group">
                    <label for="username" class="form-label">USERNAME</label>
                    <input type="text" id="username" class="form-input" placeholder="choose username" required>
                    <div class="form-error" id="usernameError"></div>
                </div>

                <div class="form-group">
                    <label for="email" class="form-label">EMAIL</label>
                    <input type="email" id="email" class="form-input" placeholder="email@example.com" required>
                    <div class="form-error" id="emailError"></div>
                </div>

                <div class="form-group">
                    <label for="password" class="form-label">PASSWORD</label>
                    <input type="password" id="password" class="form-input" placeholder="••••••••" required>
                    <div class="form-error" id="passwordError"></div>
                </div>

                <div class="form-group">
                    <label for="confirmPassword" class="form-label">CONFIRM PASSWORD</label>
                    <input type="password" id="confirmPassword" class="form-input" placeholder="••••••••" required>
                    <div class="form-error" id="confirmPasswordError"></div>
                </div>

                <button type="submit" class="form-btn" id="signupBtn">CREATE ACCOUNT</button>
                <div class="form-message" id="signupMessage"></div>
            </form>

            <div class="form-links">
                <a href="/login" class="form-link">Already have an account?</a>
                <a href="/" class="form-link">Back to home</a>
            </div>
        </div>
    </div>

    <script src="/assets/js/particles.js"></script>
    <script src="/assets/js/auth.js"></script>
    <script>
        // Initialize particles
        if (typeof initParticles === 'function') {
            initParticles();
        }

        // Check if already logged in
        const userData = localStorage.getItem('socialanxiety_user');
        if (userData) {
            window.location.href = '/dashboard';
        }

        // Form submission
        document.getElementById('signupForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const username = document.getElementById('username').value.trim();
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirmPassword').value;
            
            // Validation
            // ... (use JavaScript validation)
            
            // Call Supabase API
            const response = await supabaseSignup(username, email, password);
            
            if (response.success) {
                // Store user data
                localStorage.setItem('socialanxiety_user', JSON.stringify(response.user));
                window.location.href = '/dashboard';
            } else {
                // Show error
                document.getElementById('signupMessage').textContent = response.error;
                document.getElementById('signupMessage').style.display = 'block';
            }
        });
    </script>
</body>
</html>
