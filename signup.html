<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - socialanxiety.lol</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&family=JetBrains+Mono:wght@300;400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary: #6366f1;
            --primary-dark: #4f46e5;
            --secondary: #8b5cf6;
            --dark: #0f172a;
            --darker: #020617;
            --light: #f8fafc;
            --gray: #64748b;
            --gray-dark: #334155;
            --border: rgba(255, 255, 255, 0.1);
            --card-bg: rgba(30, 41, 59, 0.4);
            --success: #10b981;
            --error: #ef4444;
            --gradient: linear-gradient(135deg, var(--primary), var(--secondary));
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background: var(--darker);
            color: var(--light);
            line-height: 1.6;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1rem;
        }

        .container {
            width: 100%;
            max-width: 500px;
        }

        .header {
            text-align: center;
            margin-bottom: 2.5rem;
        }

        .logo {
            font-family: 'JetBrains Mono', monospace;
            font-size: 2rem;
            font-weight: 700;
            background: var(--gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-decoration: none;
            margin-bottom: 1rem;
            display: inline-block;
        }

        .header h1 {
            font-size: 1.8rem;
            margin-bottom: 0.5rem;
        }

        .header p {
            color: var(--gray);
        }

        .form-container {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 1rem;
            padding: 2.5rem;
            backdrop-filter: blur(10px);
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        .form-label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 500;
            color: var(--light);
        }

        .form-input {
            width: 100%;
            padding: 0.875rem 1rem;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border);
            border-radius: 0.75rem;
            color: var(--light);
            font-size: 1rem;
            font-family: inherit;
            transition: all 0.3s ease;
        }

        .form-input:focus {
            outline: none;
            border-color: var(--primary);
            background: rgba(99, 102, 241, 0.05);
        }

        .form-input::placeholder {
            color: var(--gray);
        }

        .input-with-icon {
            position: relative;
        }

        .input-icon {
            position: absolute;
            right: 1rem;
            top: 50%;
            transform: translateY(-50%);
            color: var(--gray);
        }

        .form-error {
            color: var(--error);
            font-size: 0.875rem;
            margin-top: 0.5rem;
            display: none;
        }

        .btn {
            width: 100%;
            padding: 1rem;
            background: var(--gradient);
            border: none;
            border-radius: 0.75rem;
            color: white;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: inherit;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(99, 102, 241, 0.3);
        }

        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none !important;
        }

        .loading {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255,255,255,0.1);
            border-radius: 50%;
            border-top-color: white;
            animation: spin 1s ease-in-out infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .divider {
            text-align: center;
            margin: 2rem 0;
            position: relative;
            color: var(--gray);
        }

        .divider::before,
        .divider::after {
            content: '';
            position: absolute;
            top: 50%;
            width: 45%;
            height: 1px;
            background: var(--border);
        }

        .divider::before {
            left: 0;
        }

        .divider::after {
            right: 0;
        }

        .social-login {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 1rem;
            margin-bottom: 1.5rem;
        }

        .social-btn {
            padding: 0.875rem;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border);
            border-radius: 0.75rem;
            color: var(--light);
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
        }

        .social-btn:hover {
            background: rgba(255, 255, 255, 0.1);
        }

        .footer-links {
            text-align: center;
            margin-top: 2rem;
            color: var(--gray);
        }

        .footer-link {
            color: var(--primary);
            text-decoration: none;
            margin-left: 0.5rem;
        }

        .footer-link:hover {
            text-decoration: underline;
        }

        .notification {
            position: fixed;
            top: 1rem;
            right: 1rem;
            padding: 1rem 1.5rem;
            background: var(--dark);
            border: 1px solid var(--border);
            border-radius: 0.75rem;
            backdrop-filter: blur(10px);
            z-index: 1001;
            animation: slideIn 0.3s ease;
            max-width: 400px;
            display: none;
        }

        @keyframes slideIn {
            from { transform: translateX(100%); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }

        .notification.success {
            border-left: 4px solid var(--success);
            display: block;
        }

        .notification.error {
            border-left: 4px solid var(--error);
            display: block;
        }

        @media (max-width: 640px) {
            .form-container {
                padding: 1.5rem;
            }
            
            .social-login {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <a href="/" class="logo">socialanxiety.lol</a>
            <h1>Create Your Account</h1>
            <p>Get your unique profile link and start customizing</p>
        </div>

        <div class="form-container">
            <form id="signupForm">
                <div class="form-group">
                    <label for="username" class="form-label">Username</label>
                    <div class="input-with-icon">
                        <input type="text" id="username" class="form-input" placeholder="Choose a username" required>
                        <div class="input-icon">
                            <i class="fas fa-at"></i>
                        </div>
                    </div>
                    <div class="form-error" id="usernameError"></div>
                </div>

                <div class="form-group">
                    <label for="email" class="form-label">Email Address</label>
                    <div class="input-with-icon">
                        <input type="email" id="email" class="form-input" placeholder="you@example.com" required>
                        <div class="input-icon">
                            <i class="fas fa-envelope"></i>
                        </div>
                    </div>
                    <div class="form-error" id="emailError"></div>
                </div>

                <div class="form-group">
                    <label for="password" class="form-label">Password</label>
                    <div class="input-with-icon">
                        <input type="password" id="password" class="form-input" placeholder="••••••••" required>
                        <div class="input-icon">
                            <i class="fas fa-lock"></i>
                        </div>
                    </div>
                    <div class="form-error" id="passwordError"></div>
                </div>

                <div class="form-group">
                    <label for="confirmPassword" class="form-label">Confirm Password</label>
                    <div class="input-with-icon">
                        <input type="password" id="confirmPassword" class="form-input" placeholder="••••••••" required>
                        <div class="input-icon">
                            <i class="fas fa-lock"></i>
                        </div>
                    </div>
                    <div class="form-error" id="confirmPasswordError"></div>
                </div>

                <button type="submit" class="btn" id="submitBtn">
                    <span id="btnText">Create Account</span>
                </button>
            </form>

            <div class="divider">or continue with</div>

            <div class="social-login">
                <button class="social-btn" onclick="signInWithGoogle()">
                    <i class="fab fa-google"></i>
                    Google
                </button>
                <button class="social-btn" onclick="signInWithGithub()">
                    <i class="fab fa-github"></i>
                    GitHub
                </button>
            </div>

            <div class="footer-links">
                Already have an account?
                <a href="/login" class="footer-link">Sign in</a>
            </div>
        </div>
    </div>

    <div class="notification" id="notification"></div>

    <script>
        // Supabase configuration
        const SUPABASE_URL = 'https://kleonejdkmalzkgehhgt.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImtsZW9uZWpka21hbHprZ2VoaGd0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjczODc1MjksImV4cCI6MjA4Mjk2MzUyOX0.5YmLdNK_-1ZydX6tVOXBFMmv9IChj8Ta8O-WLYERDQw';

        // Initialize Supabase client
        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        // Show notification
        function showNotification(message, type = 'info') {
            const notification = document.getElementById('notification');
            notification.className = `notification ${type}`;
            notification.innerHTML = `
                <div style="display: flex; align-items: center; gap: 0.5rem;">
                    <i class="fas fa-${type === 'success' ? 'check-circle' : type === 'error' ? 'exclamation-circle' : 'info-circle'}"></i>
                    <span>${message}</span>
                </div>
            `;
            
            notification.style.display = 'block';
            
            setTimeout(() => {
                notification.style.animation = 'slideIn 0.3s ease reverse';
                setTimeout(() => {
                    notification.style.display = 'none';
                }, 300);
            }, 3000);
        }

        // Show error
        function showError(elementId, message) {
            const element = document.getElementById(elementId);
            element.textContent = message;
            element.style.display = 'block';
        }

        // Clear errors
        function clearErrors() {
            document.querySelectorAll('.form-error').forEach(el => {
                el.style.display = 'none';
                el.textContent = '';
            });
        }

        // Hash password
        async function hashPassword(password) {
            const encoder = new TextEncoder();
            const data = encoder.encode(password + 'socialanxiety_salt_2024');
            const hashBuffer = await crypto.subtle.digest('SHA-256', data);
            const hashArray = Array.from(new Uint8Array(hashBuffer));
            return hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
        }

        // Check username availability
        async function checkUsername(username) {
            try {
                const { data, error } = await supabase
                    .from('users')
                    .select('id')
                    .eq('username', username.toLowerCase())
                    .single();
                
                return !data; // Available if no data returned
            } catch (error) {
                return true; // Available on error
            }
        }

        // Form submission
        document.getElementById('signupForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            clearErrors();
            
            const username = document.getElementById('username').value.trim();
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirmPassword').value;
            
            // Validation
            let isValid = true;
            
            if (username.length < 3) {
                showError('usernameError', 'Username must be at least 3 characters');
                isValid = false;
            }
            
            if (!/^[a-zA-Z0-9_]+$/.test(username)) {
                showError('usernameError', 'Only letters, numbers, and underscores allowed');
                isValid = false;
            }
            
            if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
                showError('emailError', 'Please enter a valid email address');
                isValid = false;
            }
            
            if (password.length < 6) {
                showError('passwordError', 'Password must be at least 6 characters');
                isValid = false;
            }
            
            if (password !== confirmPassword) {
                showError('confirmPasswordError', 'Passwords do not match');
                isValid = false;
            }
            
            if (!isValid) return;
            
            // Check username availability
            const isAvailable = await checkUsername(username);
            if (!isAvailable) {
                showError('usernameError', 'Username already taken');
                return;
            }
            
            // Update button state
            const submitBtn = document.getElementById('submitBtn');
            const btnText = document.getElementById('btnText');
            btnText.innerHTML = '<div class="loading"></div>';
            submitBtn.disabled = true;
            
            try {
                // Hash password
                const passwordHash = await hashPassword(password);
                
                // Create user
                const { data: user, error: userError } = await supabase
                    .from('users')
                    .insert({
                        username: username.toLowerCase(),
                        email: email.toLowerCase(),
                        password_hash: passwordHash,
                        profile_link: username.toLowerCase(),
                        created_at: new Date().toISOString()
                    })
                    .select()
                    .single();
                
                if (userError) {
                    if (userError.code === '23505') {
                        if (userError.message.includes('username')) {
                            showError('usernameError', 'Username already taken');
                        } else if (userError.message.includes('email')) {
                            showError('emailError', 'Email already registered');
                        }
                        throw userError;
                    }
                    throw userError;
                }
                
                // Create profile
                const avatarUrl = `https://api.dicebear.com/7.x/avataaars/svg?seed=${username}`;
                const bannerUrl = `https://images.unsplash.com/photo-1614850523060-8da1d56ae167?w=1200&h=400&fit=crop&auto=format&q=80`;
                
                const { error: profileError } = await supabase
                    .from('profiles')
                    .insert({
                        user_id: user.id,
                        username: username,
                        pfp_url: avatarUrl,
                        banner_url: bannerUrl,
                        bio: '',
                        theme: 'dark',
                        music_url: '',
                        stats_views: 0,
                        stats_visitors: 0,
                        created_at: new Date().toISOString()
                    });
                
                if (profileError) throw profileError;
                
                // Store user in localStorage
                const userData = {
                    id: user.id,
                    username: user.username,
                    email: user.email,
                    profileLink: user.profile_link,
                    createdAt: user.created_at
                };
                localStorage.setItem('socialanxiety_user', JSON.stringify(userData));
                
                // Show success
                showNotification('Account created successfully! Redirecting...', 'success');
                
                // Redirect to dashboard
                setTimeout(() => {
                    window.location.href = '/dashboard';
                }, 2000);
                
            } catch (error) {
                console.error('Signup error:', error);
                showNotification('Failed to create account. Please try again.', 'error');
            } finally {
                btnText.textContent = 'Create Account';
                submitBtn.disabled = false;
            }
        });

        // Social login functions
        function signInWithGoogle() {
            showNotification('Google login coming soon!', 'info');
        }

        function signInWithGithub() {
            showNotification('GitHub login coming soon!', 'info');
        }

        // Real-time username checking
        let usernameTimeout;
        document.getElementById('username').addEventListener('input', async (e) => {
            clearTimeout(usernameTimeout);
            const username = e.target.value.trim();
            
            if (username.length < 3) return;
            
            usernameTimeout = setTimeout(async () => {
                const isAvailable = await checkUsername(username);
                const errorElement = document.getElementById('usernameError');
                
                if (!isAvailable) {
                    errorElement.textContent = 'Username already taken';
                    errorElement.style.display = 'block';
                } else {
                    errorElement.style.display = 'none';
                }
            }, 500);
        });
    </script>
</body>
</html>
