<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - socialanxiety.lol</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: #000000;
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            overflow: hidden;
        }

        /* Background */
        .bg-grid {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: 
                linear-gradient(rgba(255, 255, 255, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
            background-size: 40px 40px;
            opacity: 0.3;
            animation: gridSlide 20s linear infinite;
        }

        @keyframes gridSlide {
            0% { transform: translate(0, 0); }
            100% { transform: translate(40px, 40px); }
        }

        /* Back button */
        .back-btn {
            position: fixed;
            top: 2rem;
            left: 2rem;
            color: rgba(255, 255, 255, 0.5);
            text-decoration: none;
            font-size: 0.9rem;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            transition: color 0.3s ease;
            z-index: 10;
        }

        .back-btn:hover {
            color: #ffffff;
        }

        /* Login container */
        .login-container {
            width: 100%;
            max-width: 400px;
            padding: 2rem;
            position: relative;
            z-index: 2;
        }

        /* Header */
        .header {
            text-align: center;
            margin-bottom: 3rem;
        }

        .logo {
            font-size: 2rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
            letter-spacing: -1px;
        }

        .subtitle {
            color: rgba(255, 255, 255, 0.5);
            font-size: 0.9rem;
            font-weight: 400;
        }

        /* Form */
        .form {
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
        }

        .input-group {
            position: relative;
        }

        .input-label {
            display: block;
            margin-bottom: 0.5rem;
            font-size: 0.85rem;
            font-weight: 500;
            color: rgba(255, 255, 255, 0.8);
        }

        .input-field {
            width: 100%;
            padding: 1rem;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            color: #ffffff;
            font-size: 0.95rem;
            transition: all 0.3s ease;
        }

        .input-field:focus {
            outline: none;
            border-color: rgba(255, 255, 255, 0.3);
            background: rgba(255, 255, 255, 0.08);
        }

        .input-field::placeholder {
            color: rgba(255, 255, 255, 0.3);
        }

        /* Submit button */
        .submit-btn {
            width: 100%;
            padding: 1rem;
            background: #ffffff;
            color: #000000;
            border: none;
            border-radius: 8px;
            font-size: 0.9rem;
            font-weight: 600;
            letter-spacing: 1px;
            text-transform: uppercase;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 1rem;
        }

        .submit-btn:hover {
            background: rgba(255, 255, 255, 0.9);
            transform: translateY(-2px);
        }

        /* Links */
        .links {
            text-align: center;
            margin-top: 2rem;
            padding-top: 2rem;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
        }

        .link-text {
            color: rgba(255, 255, 255, 0.5);
            font-size: 0.85rem;
        }

        .link {
            color: #ffffff;
            text-decoration: none;
            font-weight: 500;
            transition: color 0.3s ease;
        }

        .link:hover {
            color: rgba(255, 255, 255, 0.8);
        }

        /* Form line animation */
        .form-line {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 1px;
            background: linear-gradient(90deg, 
                transparent, 
                rgba(255, 255, 255, 0.3), 
                transparent);
            transform: scaleX(0);
            transform-origin: left;
            transition: transform 0.3s ease;
        }

        .input-field:focus + .form-line {
            transform: scaleX(1);
        }

        /* Error message */
        .error-message {
            color: #ff6b6b;
            font-size: 0.85rem;
            margin-top: 0.5rem;
            display: none;
        }

        /* Focus animation */
        @keyframes inputFocus {
            0% { box-shadow: 0 0 0 0 rgba(255, 255, 255, 0.1); }
            100% { box-shadow: 0 0 0 2px rgba(255, 255, 255, 0.1); }
        }

        .input-field:focus {
            animation: inputFocus 0.3s ease;
        }
    </style>
</head>
<body>
    <div class="bg-grid"></div>
    
    <a href="index.html" class="back-btn">
        ← BACK
    </a>

    <div class="login-container">
        <div class="header">
            <div class="logo">socialanxiety.lol</div>
            <div class="subtitle">Sign in to your account</div>
        </div>

        <form class="form" id="loginForm">
            <div class="input-group">
                <label class="input-label">EMAIL OR USERNAME</label>
                <input type="text" class="input-field" placeholder="Enter your email or username" required>
                <div class="form-line"></div>
            </div>

            <div class="input-group">
                <label class="input-label">PASSWORD</label>
                <input type="password" class="input-field" placeholder="Enter your password" required>
                <div class="form-line"></div>
                <div class="error-message" id="passwordError"></div>
            </div>

            <button type="submit" class="submit-btn">LOGIN</button>
        </form>

        <div class="links">
            <span class="link-text">Don't have an account?</span>
            <a href="signup.html" class="link"> SIGN UP</a>
        </div>
    </div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            // Here you would normally handle login with Supabase
            // For now, just redirect to dashboard
            window.location.href = 'dashboard.html';
        });

        // Add input focus effects
        const inputs = document.querySelectorAll('.input-field');
        inputs.forEach(input => {
            input.addEventListener('focus', function() {
                this.parentElement.querySelector('.form-line').style.transform = 'scaleX(1)';
            });
            
            input.addEventListener('blur', function() {
                if (!this.value) {
                    this.parentElement.querySelector('.form-line').style.transform = 'scaleX(0)';
                }
            });
        });
    </script>
</body>
</html>
