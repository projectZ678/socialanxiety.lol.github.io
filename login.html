<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - socialanxiety.lol</title>
    <!-- Load Supabase FIRST -->
    <script src="https://unpkg.com/@supabase/supabase-js@2.38.0"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, sans-serif;
        }
        
        body {
            background: #000000;
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        
        .container {
            width: 100%;
            max-width: 420px;
        }
        
        .back-link {
            display: block;
            color: #888;
            text-decoration: none;
            margin-bottom: 30px;
            font-size: 14px;
        }
        
        .back-link:hover {
            color: #fff;
        }
        
        .card {
            background: #111111;
            border: 1px solid #333333;
            border-radius: 12px;
            padding: 40px 30px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }
        
        .logo {
            text-align: center;
            margin-bottom: 30px;
        }
        
        .logo h1 {
            font-size: 32px;
            font-weight: 800;
            background: linear-gradient(135deg, #fff 0%, #aaa 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 10px;
        }
        
        .logo p {
            color: #888;
            font-size: 14px;
        }
        
        .form-group {
            margin-bottom: 20px;
        }
        
        label {
            display: block;
            margin-bottom: 8px;
            color: #aaa;
            font-size: 13px;
            font-weight: 600;
            text-transform: uppercase;
        }
        
        input {
            width: 100%;
            padding: 14px;
            background: rgba(255,255,255,0.05);
            border: 1px solid #333;
            border-radius: 8px;
            color: #fff;
            font-size: 15px;
        }
        
        input:focus {
            outline: none;
            border-color: #666;
            background: rgba(255,255,255,0.08);
        }
        
        .error {
            background: rgba(255, 50, 50, 0.1);
            border: 1px solid rgba(255, 50, 50, 0.3);
            border-radius: 8px;
            padding: 12px;
            margin: 20px 0;
            color: #ff3232;
            font-size: 14px;
            display: none;
        }
        
        .success {
            background: rgba(50, 255, 50, 0.1);
            border: 1px solid rgba(50, 255, 50, 0.3);
            border-radius: 8px;
            padding: 12px;
            margin: 20px 0;
            color: #32ff32;
            font-size: 14px;
            display: none;
        }
        
        button {
            width: 100%;
            padding: 16px;
            background: #fff;
            color: #000;
            border: none;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            margin-top: 10px;
        }
        
        button:hover {
            background: #f0f0f0;
        }
        
        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        
        .signup-link {
            text-align: center;
            margin-top: 25px;
            color: #888;
            font-size: 14px;
        }
        
        .signup-link a {
            color: #fff;
            text-decoration: none;
            font-weight: 600;
        }
        
        .forgot-link {
            text-align: right;
            margin-top: 5px;
        }
        
        .forgot-link a {
            color: #888;
            text-decoration: none;
            font-size: 13px;
        }
    </style>
</head>
<body>
    <div class="container">
        <a href="index.html" class="back-link">← Back to Home</a>
        
        <div class="card">
            <div class="logo">
                <h1>socialanxiety.lol</h1>
                <p>Sign in to your account</p>
            </div>

            <form id="loginForm">
                <div class="form-group">
                    <label>Email</label>
                    <input type="email" id="email" placeholder="your@email.com" required>
                </div>

                <div class="form-group">
                    <label>Password</label>
                    <input type="password" id="password" placeholder="Enter your password" required>
                    <div class="forgot-link">
                        <a href="#" onclick="alert('Password reset coming soon!')">Forgot password?</a>
                    </div>
                </div>

                <div id="error" class="error"></div>
                <div id="success" class="success"></div>

                <button type="submit" id="submitBtn">Sign In</button>
            </form>

            <div class="signup-link">
                Don't have an account? <a href="signup.html">Create one here</a>
            </div>
        </div>
    </div>

    <script>
        // ⚠️ PUT YOUR REAL CREDENTIALS HERE ⚠️
        const SUPABASE_URL = 'https://kleonejdkmalzkgehhgt.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImtsZW9uZWpka21hbHprZ2VoaGd0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjczODc1MjksImV4cCI6MjA4Mjk2MzUyOX0.5YmLdNK_-1ZydX6tVOXBFMmv9IChj8Ta8O-WLYERDQw';
        
        // Initialize Supabase
        let supabase;
        
        function initSupabase() {
            try {
                if (!window.supabase) {
                    throw new Error('Supabase not loaded. Check internet connection.');
                }
                
                const { createClient } = window.supabase;
                supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
                console.log('Supabase initialized for login');
                return true;
            } catch (error) {
                console.error('Failed to init Supabase:', error);
                showError('Failed to load Supabase. Please refresh the page.');
                return false;
            }
        }
        
        // Form submission
        document.getElementById('loginForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            if (!initSupabase()) {
                showError('Supabase not initialized. Please refresh.');
                return;
            }
            
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            const errorEl = document.getElementById('error');
            const successEl = document.getElementById('success');
            const submitBtn = document.getElementById('submitBtn');
            
            // Clear messages
            errorEl.style.display = 'none';
            successEl.style.display = 'none';
            errorEl.textContent = '';
            successEl.textContent = '';
            
            // Disable button
            submitBtn.disabled = true;
            submitBtn.textContent = 'Signing In...';
            
            try {
                console.log('Attempting login...');
                
                // Sign in with Supabase
                const { data, error } = await supabase.auth.signInWithPassword({
                    email: email,
                    password: password
                });
                
                if (error) {
                    console.error('Login error:', error);
                    throw error;
                }
                
                if (!data.user) {
                    throw new Error('Login failed. Please try again.');
                }
                
                console.log('Login successful:', data.user.id);
                
                // Get or create profile
                try {
                    const { data: profile, error: profileError } = await supabase
                        .from('profiles')
                        .select('*')
                        .eq('id', data.user.id)
                        .single();
                    
                    if (profileError && profileError.code === 'PGRST116') {
                        // Profile doesn't exist, create one
                        console.log('Creating profile for existing user...');
                        const username = data.user.email.split('@')[0];
                        
                        await supabase
                            .from('profiles')
                            .insert([
                                {
                                    id: data.user.id,
                                    username: username,
                                    email: data.user.email,
                                    bio: '',
                                    created_at: new Date().toISOString()
                                }
                            ]);
                    }
                } catch (profileError) {
                    console.warn('Profile error (non-critical):', profileError);
                }
                
                // Success!
                successEl.textContent = 'Login successful! Redirecting...';
                successEl.style.display = 'block';
                
                // Store in localStorage
                localStorage.setItem('user', JSON.stringify({
                    id: data.user.id,
                    email: data.user.email
                }));
                
                // Redirect to dashboard after 1.5 seconds
                setTimeout(() => {
                    window.location.href = 'dashboard.html';
                }, 1500);
                
            } catch (error) {
                console.error('Login error:', error);
                
                let errorMessage = error.message;
                
                // User-friendly error messages
                if (errorMessage.includes('Invalid login credentials')) {
                    errorMessage = 'Invalid email or password. Please try again.';
                } else if (errorMessage.includes('Email not confirmed')) {
                    errorMessage = 'Please check your email to confirm your account.';
                } else if (errorMessage.includes('rate limit')) {
                    errorMessage = 'Too many attempts. Please wait a moment.';
                }
                
                showError(errorMessage);
                submitBtn.disabled = false;
                submitBtn.textContent = 'Sign In';
            }
        });
        
        function showError(message) {
            const errorEl = document.getElementById('error');
            errorEl.textContent = message;
            errorEl.style.display = 'block';
        }
        
        // Initialize on load
        document.addEventListener('DOMContentLoaded', function() {
            console.log('Login page loaded');
            initSupabase();
        });
    </script>
</body>
</html>
