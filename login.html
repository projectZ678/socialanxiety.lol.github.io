<!DOCTYPE html>
<html>
<head>
    <title>Login</title>
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
    <script>
        const SUPABASE_URL = 'https://kleonejdkmalzkgehhgt.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImtsZW9uZWpka21hbHprZ2VoaGd0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjczODc1MjksImV4cCI6MjA4Mjk2MzUyOX0.5YmLdNK_-1ZydX6tVOXBFMmv9IChj8Ta8O-WLYERDQwY';
        const { createClient } = window.supabase;
        const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    </script>
    <style>
        body { background: black; color: white; padding: 50px; font-family: sans-serif; }
        .container { max-width: 400px; margin: 0 auto; }
        input, button { width: 100%; padding: 15px; margin: 10px 0; border-radius: 8px; }
        input { background: #111; border: 1px solid #333; color: white; }
        button { background: white; color: black; border: none; font-weight: bold; cursor: pointer; }
        button:hover { background: #ddd; }
        .error { color: red; margin: 10px 0; }
        .success { color: green; margin: 10px 0; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Login</h1>
        <form id="loginForm">
            <input type="email" id="email" placeholder="Email" required>
            <input type="password" id="password" placeholder="Password" required>
            <div id="error" class="error"></div>
            <div id="success" class="success"></div>
            <button type="submit">Login</button>
        </form>
        <p>No account? <a href="signup.html" style="color: white;">Sign up</a></p>
        <p><a href="index.html" style="color: #888;">← Back</a></p>
    </div>
    
    <script>
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            
            try {
                const { data, error } = await supabase.auth.signInWithPassword({
                    email, password
                });
                
                if (error) throw error;
                
                document.getElementById('success').textContent = 'Login successful!';
                setTimeout(() => window.location.href = 'dashboard.html', 1000);
            } catch (err) {
                document.getElementById('error').textContent = err.message;
            }
        });
    </script>
</body>
</html>
