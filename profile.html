<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile - socialanxiety.lol</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
    <script src="supabase-config.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: #000000;
            color: #ffffff;
            min-height: 100vh;
        }

        .profile-header {
            height: 300px;
            position: relative;
            overflow: hidden;
        }

        .profile-banner {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .profile-avatar {
            position: absolute;
            bottom: -60px;
            left: 50%;
            transform: translateX(-50%);
            width: 150px;
            height: 150px;
            border-radius: 50%;
            border: 6px solid #000000;
            background: #222;
            overflow: hidden;
        }

        .profile-avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .profile-content {
            padding: 100px 2rem 2rem;
            max-width: 800px;
            margin: 0 auto;
            text-align: center;
        }

        .profile-username {
            font-size: 3rem;
            font-weight: 900;
            margin-bottom: 1rem;
            letter-spacing: -1px;
        }

        .profile-bio {
            font-size: 1.2rem;
            color: #999;
            line-height: 1.6;
            margin-bottom: 2rem;
            max-width: 600px;
            margin-left: auto;
            margin-right: auto;
        }

        .audio-player {
            background: #111;
            border: 1px solid #333;
            border-radius: 15px;
            padding: 2rem;
            margin-top: 2rem;
            max-width: 500px;
            margin-left: auto;
            margin-right: auto;
        }

        .player-controls {
            display: flex;
            align-items: center;
            gap: 1.5rem;
            margin-bottom: 1rem;
        }

        .play-btn {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background: #ffffff;
            color: #000000;
            border: none;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 1.5rem;
        }

        .play-btn:hover {
            background: rgba(255, 255, 255, 0.9);
            transform: scale(1.05);
        }

        .track-info h4 {
            font-size: 1.2rem;
            margin-bottom: 0.5rem;
            font-weight: 600;
        }

        .track-info p {
            color: #999;
            font-size: 0.9rem;
        }

        .profile-stats {
            display: flex;
            justify-content: center;
            gap: 3rem;
            margin-top: 3rem;
            padding-top: 3rem;
            border-top: 1px solid #333;
        }

        .stat-item {
            text-align: center;
        }

        .stat-number {
            font-size: 2rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
        }

        .stat-label {
            font-size: 0.9rem;
            color: #999;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .back-link {
            position: fixed;
            top: 2rem;
            left: 2rem;
            color: #666;
            text-decoration: none;
            font-size: 0.9rem;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            transition: color 0.3s ease;
            z-index: 100;
        }

        .back-link:hover {
            color: #ffffff;
        }

        .home-link {
            position: fixed;
            top: 2rem;
            right: 2rem;
            color: #666;
            text-decoration: none;
            font-size: 0.9rem;
            font-weight: 500;
            transition: color 0.3s ease;
            z-index: 100;
        }

        .home-link:hover {
            color: #ffffff;
        }

        @media (max-width: 768px) {
            .profile-header {
                height: 200px;
            }
            
            .profile-avatar {
                width: 120px;
                height: 120px;
                bottom: -50px;
            }
            
            .profile-username {
                font-size: 2rem;
            }
            
            .profile-stats {
                gap: 1.5rem;
                flex-direction: column;
            }
        }
    </style>
</head>
<body>
    <a href="index.html" class="back-link">← Back</a>
    <a href="index.html" class="home-link">Home</a>
    
    <div class="profile-page">
        <div class="profile-header" id="profileBanner">
            <!-- Banner loaded via JS -->
        </div>
        
        <div class="profile-content">
            <div class="profile-avatar" id="profileAvatar">
                <!-- Avatar loaded via JS -->
            </div>
            
            <h1 class="profile-username" id="profileUsername">Loading...</h1>
            <p class="profile-bio" id="profileBio"></p>
            
            <div class="audio-player" id="audioPlayer" style="display: none;">
                <div class="player-controls">
                    <button class="play-btn" id="playBtn">▶</button>
                    <div class="track-info">
                        <h4 id="trackTitle">Audio Title</h4>
                        <p id="trackStatus">Click play to listen</p>
                    </div>
                </div>
            </div>
            
            <div class="profile-stats">
                <div class="stat-item">
                    <div class="stat-number" id="viewsCount">0</div>
                    <div class="stat-label">Views</div>
                </div>
                <div class="stat-item">
                    <div class="stat-number" id="audioPlays">0</div>
                    <div class="stat-label">Audio Plays</div>
                </div>
                <div class="stat-item">
                    <div class="stat-number" id="memberSince">Today</div>
                    <div class="stat-label">Member Since</div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const supabase = window.supabase;
        let currentAudio = null;

        // Get username from URL
        function getUsernameFromURL() {
            const urlParams = new URLSearchParams(window.location.search);
            return urlParams.get('user');
        }

        // Load profile data
        async function loadProfile() {
            const username = getUsernameFromURL();
            
            if (!username) {
                document.getElementById('profileUsername').textContent = 'User not found';
                return;
            }
            
            try {
                // Load profile data
                const { data: profile, error } = await supabase
                    .from('profiles')
                    .select('*')
                    .eq('username', username.toLowerCase())
                    .single();
                
                if (error || !profile) {
                    document.getElementById('profileUsername').textContent = 'User not found';
                    document.getElementById('profileBio').textContent = 'This profile doesn\'t exist or has been deleted.';
                    return;
                }
                
                // Update view count
                await supabase
                    .from('profiles')
                    .update({
                        views: (profile.views || 0) + 1
                    })
                    .eq('id', profile.id);
                
                // Update UI
                document.getElementById('profileUsername').textContent = profile.username;
                document.getElementById('profileBio').textContent = profile.bio || '';
                document.getElementById('viewsCount').textContent = (profile.views || 0) + 1;
                
                // Update page title
                document.title = `${profile.username} - socialanxiety.lol`;
                
                // Set banner
                const bannerEl = document.getElementById('profileBanner');
                if (profile.banner_url) {
                    bannerEl.innerHTML = `<img src="${profile.banner_url}" alt="Banner" class="profile-banner">`;
                } else {
                    bannerEl.style.background = 'linear-gradient(45deg, #222, #333)';
                }
                
                // Set avatar
                const avatarEl = document.getElementById('profileAvatar');
                if (profile.avatar_url) {
                    avatarEl.innerHTML = `<img src="${profile.avatar_url}" alt="${profile.username}">`;
                } else {
                    avatarEl.innerHTML = `<div style="font-size: 3rem; display: flex; align-items: center; justify-content: center; height: 100%;">👤</div>`;
                }
                
                // Set audio player
                if (profile.mp3_url) {
                    document.getElementById('audioPlayer').style.display = 'block';
                    document.getElementById('trackTitle').textContent = profile.mp3_name || 'Audio';
                    
                    // Setup audio player
                    currentAudio = new Audio(profile.mp3_url);
                    const playBtn = document.getElementById('playBtn');
                    
                    playBtn.onclick = async () => {
                        if (currentAudio.paused) {
                            await currentAudio.play();
                            playBtn.textContent = '⏸';
                            
                            // Increment play count
                            await supabase
                                .from('profiles')
                                .update({
                                    audio_plays: (profile.audio_plays || 0) + 1
                                })
                                .eq('id', profile.id);
                            
                            document.getElementById('audioPlays').textContent = (profile.audio_plays || 0) + 1;
                        } else {
                            currentAudio.pause();
                            playBtn.textContent = '▶';
                        }
                    };
                    
                    currentAudio.onended = () => {
                        playBtn.textContent = '▶';
                    };
                    
                    document.getElementById('audioPlays').textContent = profile.audio_plays || 0;
                }
                
                // Format member since date
                if (profile.created_at) {
                    const date = new Date(profile.created_at);
                    const formattedDate = date.toLocaleDateString('en-US', {
                        year: 'numeric',
                        month: 'short',
                        day: 'numeric'
                    });
                    document.getElementById('memberSince').textContent = formattedDate;
                }
                
            } catch (error) {
                console.error('Error loading profile:', error);
                document.getElementById('profileUsername').textContent = 'Error loading profile';
            }
        }

        // Load profile on page load
        document.addEventListener('DOMContentLoaded', loadProfile);
    </script>
</body>
</html>
